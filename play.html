<style>

  html, body { margin: 0; height: 100%; background: #05040d; overflow: hidden; color: var(--ink);

  .overlay.show { display: flex; animation: fadeIn .25s ease-out; }
  .overlay.scroll { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  .overlay.scroll > * { flex: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  h1 { margin: 0; font-size: 44px; letter-spacing: 6px; color: var(--gold);
    text-shadow: 0 0 18px rgba(255, 190, 90, 0.8), 0 0 48px rgba(255, 140, 60, 0.5); }
  h2 { margin: 0 0 12px; font-size: 22px; color: var(--gold); text-shadow: 0 0 12px rgba(255, 190, 90, 0.6); }
  .sub { color: var(--dim); font-size: 14px; margin: 8px 0 18px; line-height: 1.6; }

    border: 1px solid var(--edge); background: linear-gradient(180deg, #3a2a10, #1c1208); color: var(--gold);

  .btn.small { display: inline-block; width: auto; padding: 10px 14px; margin: 4px; font-size: 14px; }
  .row2 { display: flex; gap: 8px; width: min(280px, 100%); }
  .row2 .btn { flex: 1; margin: 4px 0; }
  .oil { font-size: 14px; color: var(--dim); } .oil b { color: var(--gold); font-size: 18px; margin-left: 4px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; width: min(380px, 100%); margin-bottom: 10px; }
  .topbar h2 { margin: 0; }
  .progress { font-size: 12px; color: var(--dim); margin: 2px 0 18px; }

  .chapter { display: block; width: min(340px, 100%); padding: 14px; margin: 0 auto 12px; border-radius: 16px; background: var(--panel); text-align: left;
    border: 1px solid var(--cc, rgba(143, 232, 255, 0.35)); box-shadow: 0 0 22px color-mix(in srgb, var(--cc, #8fe8ff) 20%, transparent); }
  .chapter b { color: var(--cc, #8fe8ff); font-size: 18px; } .chapter div { color: var(--dim); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .chapter .done { float: right; font-size: 12px; color: #ffe27a; border: 1px solid #ffe27a88; border-radius: 8px; padding: 1px 6px; }
  .chapter .best { color: #cfd6ff; }
  .ch1 { --cc: #8fe8ff; } .ch2 { --cc: #9fe6a8; } .ch3 { --cc: #e6a0ff; }

  .list { width: min(380px, 100%); }
  .list .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(160, 170, 255, 0.18); text-align: left; }
  .row .info { flex: 1; } .row .lv { color: var(--gold); font-size: 13px; } .row .d { color: #cfd6ff; font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .row .buy { min-width: 64px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--edge); background: #2a1e0c; color: var(--gold); font-weight: 700; line-height: 1.2; }
  .row .max { color: var(--dim); font-size: 13px; }

  .equipped, .bag { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(380px, 100%); }
  .gear { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border-radius: 12px; background: var(--panel); text-align: left;
    border: 1px solid var(--c, rgba(160, 170, 255, 0.2)); position: relative; font-size: 13px; }
  .gear b { color: var(--c, var(--dim)); } .gear .slot { font-size: 11px; color: var(--dim); } .gear .main { font-size: 12px; color: #cfd6ff; }
  .gear .eq { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #ffe27a; }
  .gear.empty { opacity: 0.55; }
  .summary { width: min(380px, 100%); font-size: 12px; color: #cfd6ff; margin: 10px 0; line-height: 1.5; text-align: left; }
  .bag-title { width: min(380px, 100%); text-align: left; font-size: 13px; color: var(--dim); margin: 6px 0; }
  .empty-bag { grid-column: 1 / -1; color: var(--dim); font-size: 13px; padding: 12px; }
  .sheet { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.5); z-index: 5; }
  .sheet.show { display: flex; }
  .sheet-card { width: min(420px, 100%); box-sizing: border-box; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); border-radius: 18px 18px 0 0;
    background: #141032; border-top: 2px solid var(--c); text-align: left; }
  .sheet-card .name { color: var(--c); font-size: 18px; } .sheet-card .rar { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .sheet-card ul { margin: 0 0 10px; padding-left: 18px; font-size: 14px; line-height: 1.7; } .sheet-card .mainline { color: #ffe9a8; font-weight: 700; }
  .sheet-card .acts { text-align: center; }

  .cards { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
  .card { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--c, var(--edge)); box-shadow: 0 0 16px color-mix(in srgb, var(--c, #ffd27a) 30%, transparent); }
  .card:active { transform: scale(0.98); }
  .card img { width: 52px; height: 52px; flex: none; }
  .card .t { font-weight: 800; font-size: 16px; } .card .l { font-size: 12px; font-weight: 700; color: var(--c); margin-left: 6px; }
  .card .d { font-size: 13px; color: #cfd6ff; margin-top: 3px; line-height: 1.4; } .card .h { font-size: 11px; color: #ffcf8a; margin-top: 4px; }
  .build { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 16px; max-width: 320px; }
  .build span { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--dim); width: 60px; }

  .ledger .total { border-top: 1px solid var(--edge); margin-top: 4px; padding-top: 6px; font-size: 16px; }
  .ledger .note { font-size: 12px; color: var(--dim); }
  .drops { width: min(300px, 100%); margin-bottom: 10px; } .drops-title { font-size: 13px; color: var(--dim); margin-bottom: 4px; }

  .drop b { color: var(--c); }
  .win h1 { font-size: 36px; } .lose h1 { font-size: 36px; color: #c9b8ff; text-shadow: 0 0 18px rgba(150, 120, 255, 0.7); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.6; }
  .linkish { background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; margin-top: 10px; }
  .row2 .btn { position: relative; }
  .shop-dot { display: none; position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff7a8a; box-shadow: 0 0 8px #ff7a8a; }
  .wallet { display: flex; gap: 12px; justify-content: center; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .wallet b { color: var(--gold); font-size: 15px; margin-left: 3px; }
  .sim-banner { width: min(380px, 100%); box-sizing: border-box; padding: 8px 10px; margin: 6px 0 10px; border-radius: 10px; font-size: 13px;
    background: rgba(120, 200, 255, 0.1); border: 1px dashed rgba(143, 232, 255, 0.6); color: #bfeaff; }
  .shop-sec { width: min(380px, 100%); margin-bottom: 12px; text-align: left; }
  .sec-title { font-size: 15px; font-weight: 800; color: var(--gold); margin: 4px 0 6px; }
  .shop-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(160, 170, 255, 0.18); }
  .shop-row > div { flex: 1; } .shop-row .d, .shop-sec .d { color: #cfd6ff; font-size: 12px; margin-top: 2px; line-height: 1.45; }
  .shop-sec .small { font-size: 11px; color: var(--dim); margin: 4px 0 8px; }
  .shop-row .buy { min-width: 76px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--edge); background: #2a1e0c; color: var(--gold); font-weight: 700; line-height: 1.2; }
  .shop-row .max { color: var(--dim); font-size: 12px; } .lim { font-size: 11px; color: #ffcf8a; margin-left: 6px; }
  .odds { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); border-radius: 12px; overflow: hidden; }
  .odds th { font-weight: 600; color: var(--dim); font-size: 11px; padding: 6px; } .odds td { padding: 5px 8px; border-top: 1px solid rgba(160, 170, 255, 0.12); }
  .odds td:nth-child(n+2), .odds th:nth-child(n+2) { text-align: right; }
  .pity { font-size: 12px; color: #ffe9a8; margin: 8px 0 2px; line-height: 1.5; } .pity b { color: #fff; }
  .gacha-btns { display: flex; gap: 8px; } .gacha-btns .btn { flex: 1; margin: 6px 0; line-height: 1.3; }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); z-index: 6; padding: 16px; box-sizing: border-box; }
  .modal.show { display: flex; }
  .modal-card { width: min(380px, 100%); max-height: 88vh; overflow-y: auto; touch-action: pan-y; padding: 16px; border-radius: 18px; background: #141032; border: 1px solid var(--edge); text-align: center; }
  .modal-card h3 { margin: 0 0 8px; color: var(--gold); } .modal-card p { font-size: 14px; color: #cfd6ff; margin: 6px 0; line-height: 1.5; }
  .sim-note { color: #bfeaff !important; font-weight: 700; }
  .gacha-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .gcard { display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--c); font-size: 12px; text-align: left; animation: pop .35s ease-out both; }
  .gcard b { color: var(--c); font-size: 13px; } .gcard .rn { font-size: 10px; color: var(--c); } .gcard .sv { color: var(--dim); font-size: 10px; }
  .gcard.r3 { box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); } .gcard.r4 { box-shadow: 0 0 22px var(--c); }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hist { list-style: none; padding: 0; margin: 6px 0; text-align: left; font-size: 12px; } .hist li { padding: 5px 0; border-bottom: 1px solid rgba(160, 170, 255, 0.12); display: flex; gap: 8px; flex-wrap: wrap; }
  .hist span { color: var(--dim); } .hist i { color: #bfeaff; font-style: normal; }
  #toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); max-width: 86%; z-index: 10;
    padding: 10px 14px; border-radius: 12px; background: rgba(20, 16, 44, 0.95); border: 1px solid var(--edge); font-size: 13px; line-height: 1.5;
    opacity: 0; pointer-events: none; transition: opacity .3s; text-align: center; }
  #toast.show { opacity: 1; }
</style>

<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="safeProbe" style="position:absolute;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none"></div>
  <button id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="#ffd27a"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="#ffd27a"/></svg></button>

  <div id="menu" class="overlay show">
    <h1>燈芯守望</h1>
    <div class="sub">菌潮入夜。提起你的燈，<br>把熄滅的燈塔一座座點回來。</div>
    <div class="oil-slot"></div>
    <div class="progress"></div>
    <button class="btn" data-act="openChapters">點燈出發</button>
    <div class="row2"><button class="btn ghost" data-act="openTalents">天賦</button><button class="btn ghost" data-act="openGear">裝備</button><button class="btn ghost" data-act="openShop">商城<span class="shop-dot"></span></button></div>
    <div class="hint">按住畫面任一處拖曳移動・武器自動攻擊<br>桌機：WASD／方向鍵・Esc 暫停</div>
    <button class="linkish" data-act="resetSave">清除進度</button>
  </div>

  <div id="chapters" class="overlay scroll">
    <h2>選擇燈塔</h2>
    <div class="list"></div>
    <button class="btn ghost" data-act="menu">返回</button>
  </div>

  <div id="talents" class="overlay scroll">
    <div class="topbar"><h2>天賦</h2><div class="oil-slot"></div></div>
    <div class="list"></div>
    <button class="btn ghost" data-act="menu">返回</button>
  </div>

  <div id="gear" class="overlay scroll">
    <div class="topbar"><h2>裝備</h2><div class="oil-slot"></div></div>
    <div class="equipped"></div>
    <div class="summary"></div>
    <div class="bag-title"></div>
    <div class="bag"></div>
    <button class="btn ghost" data-act="menu">返回</button>
    <div class="sheet"></div>
  </div>

  <!-- 商城：全部模擬，沒有任何輸入欄位、不連外 -->
  <div id="shop" class="overlay scroll">
    <div class="topbar"><h2>商城</h2></div>
    <div class="wallet-slot"></div>
    <div class="sim-banner">本遊戲所有購買皆為模擬，不會產生任何費用。</div>
    <div class="shop-sec daily"></div>
    <div class="shop-sec gacha"></div>
    <div class="shop-sec packs"></div>
    <div class="shop-sec simbuy"></div>
    <button class="linkish" data-act="shopHistory">交易紀錄</button>
    <button class="btn ghost" data-act="menu">返回</button>
    <div class="modal"></div>
  </div>

  <div id="levelup" class="overlay"><h2>選擇強化</h2><div class="cards"></div></div>

  <div id="chest" class="overlay"><h2>燈核開啟</h2><div class="cards"></div><br><button class="btn" data-act="chestClose">收下</button></div>

  <div id="pause" class="overlay">
    <h2>暫停</h2>
    <div class="build"></div>
    <button class="btn" data-act="resume">繼續</button>
    <button class="btn ghost" data-act="quit">撤離（結算已擊倒的燈油）</button>
  </div>

  <div id="result" class="overlay scroll">
    <h1></h1><div class="sub"></div>
    <dl class="stats"></dl>
    <div class="ledger"></div>
    <div class="drops"></div>
    <button class="btn" data-act="retry">再來一局</button>
    <button class="btn ghost" data-act="menu">回主選單</button>
  </div>

  <div id="toast"></div>
  <pre id="perfBox" style="display:none;position:absolute;left:6px;right:6px;top:calc(env(safe-area-inset-top) + 40px);margin:0;padding:8px;background:rgba(0,0,0,0.78);color:#9f9;font:11px/1.45 monospace;white-space:pre-wrap;z-index:20;pointer-events:none;border-radius:8px"></pre>
</div>
<script>
"use strict";
// ---- stick.js
const __m_stick_js = (() => {
// 浮動搖桿的純邏輯（不碰 DOM），input.js 用它，tools/input-latency.mjs 用同一份模擬手指軌跡量反應時間。
// cfg：
//   dead   死區（CSS px）：手指移動小於這個距離不動
//   full   拖多遠才全速（CSS px）：dead～full 之間速度線性增加
//   ring   搖桿外圈半徑（CSS px）：畫面上畫的圈
//   follow 手指拖出外圈時，原點跟著手指走（永遠保持在 ring 以內），反向時不必先把手指拖回原點
//   rampFrom 速度從哪個距離開始算起（預設＝dead；M1～M3 的舊版是從 0 算，所以一過死區就有 dead/full 的速度）
const STICK_LEGACY = { dead: 6, full: 56, ring: 56, follow: false, rampFrom: 0 }; // M1～M3 的設定（量測對照用）

function stickDown(s, id, x, y) { s.active = true; s.id = id; s.ox = x; s.oy = y; s.x = x; s.y = y; }
function stickMove(s, id, x, y, cfg) {
  if (!s.active || s.id !== id) return;
  s.x = x; s.y = y;
  if (cfg.follow) {
    const dx = x - s.ox, dy = y - s.oy, d = Math.hypot(dx, dy);
    if (d > cfg.ring) { s.ox = x - dx / d * cfg.ring; s.oy = y - dy / d * cfg.ring; }
  }
}
function stickUp(s, id) { if (s.id === id) { s.active = false; s.id = null; } }
// 回傳移動向量（長度 0～1）
function stickVector(s, cfg) {
  if (!s.active) return { x: 0, y: 0 };
  const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
  if (d <= cfg.dead) return { x: 0, y: 0 };
  const from = cfg.rampFrom ?? cfg.dead;
  const k = Math.min(1, (d - from) / Math.max(1e-6, cfg.full - from)) / d;
  return { x: dx * k, y: dy * k };
}

return { STICK_LEGACY, stickDown, stickMove, stickUp, stickVector };
})();

// ---- input.js
const __m_input_js = (() => {
// 輸入：浮動虛擬搖桿（觸控/滑鼠按住拖曳）＋鍵盤。輸出統一為 move 向量（長度 0~1）。
// 搖桿的計算在 stick.js（純邏輯，tools/input-latency.mjs 用同一份量反應時間）。
const { stickDown, stickMove, stickUp, stickVector } = __m_stick_js;
// M4 起：拖 22px 就全速；原點跟隨手指、保持在 30px 內（反向時手指只要往回拉一小段）。量測見 tools/input-latency.mjs
const STICK = { dead: 6, full: 22, ring: 30, follow: true };

function createInput(el) {
  const keys = new Set();
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); stickDown(stick, e.pointerId, e.clientX, e.clientY); e.preventDefault(); });
  el.addEventListener('pointermove', (e) => stickMove(stick, e.pointerId, e.clientX, e.clientY, STICK));
  el.addEventListener('pointerup', (e) => stickUp(stick, e.pointerId));
  el.addEventListener('pointercancel', (e) => stickUp(stick, e.pointerId));
  addEventListener('keydown', (e) => keys.add(e.code));
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); stick.active = false; });

  return {
    stick, RADIUS: STICK.ring,
    reset() { keys.clear(); stick.active = false; stick.id = null; },
    get move() {
      let x = 0, y = 0;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
      if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
      const v = stickVector(stick, STICK);
      x += v.x; y += v.y;
      const len = Math.hypot(x, y);

function makeCreature({ seed, radius, hue, spikes = 0, eyes = 1, frames = 4, scale = 2 }) {

    for (let i = 0; i < eyes; i++) {
      const ex = eyes === 1 ? 0 : (i / (eyes - 1) - 0.5) * radius * 0.9;

        case 'spark': burst(e.x, e.y, 3, G.crystal, 90, 0.25, 8); break;
        case 'revive': fx.whiteFlash = 1; banner('燈芯復燃！', true); burst(e.x, e.y, 80, G.gold, 320, 1, 14); break;
        case 'bossdown': fx.whiteFlash = 1; fx.shake = 16; burst(e.x, e.y, 120, G.gold, 380, 1.4, 16); burst(e.x, e.y, 80, G.spore, 300, 1.2, 14); break;
      }
    }
    s.events.length = 0;
    fx.shake = Math.max(0, fx.shake - dt * 30);
    for (const k of ['levelFlash', 'hurtFlash', 'whiteFlash']) fx[k] = Math.max(0, fx[k] - dt * (k === 'whiteFlash' ? 1.5 : 1));
    for (const q of fx.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
    fx.parts = fx.parts.filter((q) => q.life > 0);
    if (fx.parts.length > 900) fx.parts.splice(0, fx.parts.length - 900);
    for (const q of fx.texts) { q.y -= 30 * dt; q.life -= dt; }
    fx.texts = fx.texts.filter((q) => q.life > 0);
    if (fx.texts.length > 80) fx.texts.splice(0, fx.texts.length - 80);
    for (const list of [fx.arcs, fx.rings, fx.banners]) for (const q of list) q.life -= dt;
    fx.arcs = fx.arcs.filter((q) => q.life > 0); fx.rings = fx.rings.filter((q) => q.life > 0); fx.banners = fx.banners.filter((q) => q.life > 0);
  }

  // prof：效能量測模式（src/perf.js）才會傳入，每畫完一段呼叫 lap 記錄耗時；平常是 null，不花成本
  function render(g, s, dt, W, H, scale, safeTop = 0, hud = true, prof = null) {
    prof?.start();
    const OFF = prof?.off ?? NONE; // 效能量測的 A/B：關掉指定的繪製項目，看總時間少多少（平常是空集合）
    consume(s, dt);
    prof?.lap('特效更新');
    const vh = H / scale, p = s.player, T = s.t;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    const sx = (Math.random() - 0.5) * fx.shake, sy = (Math.random() - 0.5) * fx.shake;
    const camX = p.x - VW / 2 + sx, camY = p.y - vh / 2 + sy;
    g.setTransform(scale, 0, 0, scale, -camX * scale, -camY * scale);
    const onScreen = (x, y, m = 60) => x > camX - m && x < camX + VW + m && y > camY - m && y < camY + vh + m;

    g.fillStyle = OFF.has('ground') ? '#101020' : g.createPattern(ground, 'repeat'); g.fillRect(camX, camY, VW, vh);
    prof?.lap('地面');

    // 泥沼：深色水窪＋一圈反光
    const ter = s.chapter.terrain;
    if (ter === 'pools') for (const f of terrainIn('pools', s.terrainSeed, camX - 80, camY - 80, camX + VW + 80, camY + vh + 80)) {
      // 顏色要和霧沼地面明顯不同（先前太接近底色，等於隱形）：偏青綠的濁水＋亮邊＋漂浮反光
      const pg = g.createRadialGradient(f.x, f.y - f.r * 0.2, f.r * 0.1, f.x, f.y, f.r);
      pg.addColorStop(0, 'rgba(70,140,120,0.85)'); pg.addColorStop(0.75, 'rgba(40,95,80,0.8)'); pg.addColorStop(1, 'rgba(30,70,60,0.2)');
      g.fillStyle = pg; g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.8, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(160,240,200,0.45)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.8, 0, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = `rgba(200,255,230,${0.25 + Math.sin(T * 1.5 + f.x) * 0.12})`; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(f.x - f.r * 0.2, f.y - f.r * 0.15, f.r * 0.35, f.r * 0.12, -0.2, 0, Math.PI * 2); g.stroke();
    }

    // 地面危險：預警時畫虛線輪廓，生效時填滿
    for (const h of s.hazards) {
      const active = h.t >= h.arm, k = active ? 1 : h.t / h.arm;
      if (h.type === 'zone') {
        const col = h.src === 'poison' ? '120,255,140' : h.src === 'rain' ? '180,150,255' : '255,120,120';
        g.fillStyle = `rgba(${col},${active ? 0.35 : 0.08 + k * 0.12})`;
        g.beginPath(); g.arc(h.x, h.y, h.r, 0, Math.PI * 2); g.fill();
        g.strokeStyle = `rgba(${col},${active ? 0.8 : 0.5})`; g.lineWidth = 2; g.setLineDash(active ? [] : [6, 5]);
        g.beginPath(); g.arc(h.x, h.y, active ? h.r : h.r * (0.4 + k * 0.6), 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      } else if (h.type === 'beam') {
        g.save(); g.translate(h.x, h.y); g.rotate(h.ang);
        if (active) {
          g.globalCompositeOperation = 'lighter';
          g.fillStyle = 'rgba(200,120,255,0.35)'; g.fillRect(0, -h.w, h.len, h.w * 2);
          g.fillStyle = 'rgba(255,230,255,0.9)'; g.fillRect(0, -h.w * 0.25, h.len, h.w * 0.5);
          g.globalCompositeOperation = 'source-over';
        } else {
          g.strokeStyle = `rgba(230,160,255,${0.3 + k * 0.5})`; g.lineWidth = 2; g.setLineDash([10, 8]);
          g.beginPath(); g.moveTo(0, 0); g.lineTo(h.len, 0); g.stroke(); g.setLineDash([]);
        }
        g.restore();
      }
    }

    // 競技場光圈：外面壓暗，邊緣發光
    if (s.arena) {
      const a = s.arena;
      g.save();
      g.beginPath(); g.rect(camX - 10, camY - 10, VW + 20, vh + 20); g.arc(a.x, a.y, a.r, 0, Math.PI * 2, true);
      g.fillStyle = 'rgba(5,3,14,0.72)'; g.fill('evenodd');
      g.restore();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(255,120,200,${0.45 + Math.sin(T * 4) * 0.15})`; g.lineWidth = 6;
      g.beginPath(); g.arc(a.x, a.y, a.r, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(255,220,255,0.6)'; g.lineWidth = 1.5; g.stroke();
      g.globalCompositeOperation = 'source-over';
    }

    prof?.lap('地形與危險');
    // 燈暈（在怪物底下）
    const aura = p.weapons.find((w) => w.id === 'aura');
    if (aura?.radius) {
      g.globalCompositeOperation = 'lighter';
      const r = aura.radius * (1 + Math.sin(T * 5) * 0.03);
      g.globalAlpha = 0.55; g.drawImage(G.aura, p.x - r, p.y - r, r * 2, r * 2); g.globalAlpha = 1;
      g.strokeStyle = 'rgba(255,190,110,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
      g.globalCompositeOperation = 'source-over';
    }

    // 經驗晶
    g.globalCompositeOperation = 'lighter';
    if (!OFF.has('glow')) for (const gm of s.gems) if (onScreen(gm.x, gm.y)) { const k = gm.big ? 2 : 1; g.drawImage(G.gem, gm.x - 12 * k, gm.y - 12 * k, 24 * k, 24 * k); }
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#bff6ff';
    for (const gm of s.gems) {
      if (!onScreen(gm.x, gm.y)) continue;
      const k = gm.big ? 1.8 : gm.v >= 5 ? 1.35 : 1;
      g.beginPath(); g.moveTo(gm.x, gm.y - 5 * k); g.lineTo(gm.x + 3.5 * k, gm.y); g.lineTo(gm.x, gm.y + 5 * k); g.lineTo(gm.x - 3.5 * k, gm.y); g.fill();
    }

    // 道具
    for (const it of s.pickups) {
      const bob = Math.sin(T * 4 + it.x) * 3;
      g.globalCompositeOperation = 'lighter';
      const gl = it.type === 'chest' ? G.gold : it.type === 'heal' ? G.heal : G.magnet;
      g.globalAlpha = 0.7 + Math.sin(T * 6) * 0.2; g.drawImage(gl, it.x - gl.width / 2, it.y - gl.height / 2 + bob); g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      if (it.type === 'chest') g.drawImage(chestImg, it.x - 20, it.y - 22 + bob);
      else { const ic = makeIcon(it.type === 'heal' ? 'heal' : 'stone', it.type === 'heal' ? '#ff9fb4' : '#7fd6ff', 24); g.drawImage(ic, it.x - 12, it.y - 12 + bob); }
    }

    prof?.lap('光屑與道具');
    // 預警：衝刺／撲擊的路線、自爆範圍、瞬移落點
    for (const e of s.enemies) {
      if (e.tele) {
        const w = e.tele.w ?? e.r;
        g.save(); g.translate(e.x, e.y); g.rotate(Math.atan2(e.tele.dy, e.tele.dx));
        g.fillStyle = `rgba(255,60,120,${0.18 + Math.sin(T * 30) * 0.08})`; g.fillRect(0, -w, e.tele.len, w * 2);
        g.strokeStyle = 'rgba(255,120,170,0.7)'; g.lineWidth = 1.5; g.strokeRect(0, -w, e.tele.len, w * 2);
        g.restore();
      }
      if (e.fuse > 0) {
        const R = ENEMIES[e.kind].blastR;
        g.fillStyle = `rgba(255,140,60,${0.12 + Math.sin(T * 25) * 0.08})`; g.beginPath(); g.arc(e.x, e.y, R, 0, Math.PI * 2); g.fill();
        g.strokeStyle = 'rgba(255,170,90,0.8)'; g.lineWidth = 2; g.beginPath(); g.arc(e.x, e.y, R * (1 - e.fuse / ENEMIES[e.kind].fuse), 0, Math.PI * 2); g.stroke();
      }
      if (e.warn) {
        const q = 1 - e.warn.t / ENEMIES[e.kind].blinkWarn;
        g.strokeStyle = `rgba(255,150,255,${0.4 + q * 0.5})`; g.lineWidth = 2;
        g.beginPath(); g.arc(e.warn.x, e.warn.y, 16 - q * 8, 0, Math.PI * 2); g.stroke();
        g.beginPath(); g.moveTo(e.warn.x - 10, e.warn.y); g.lineTo(e.warn.x + 10, e.warn.y); g.moveTo(e.warn.x, e.warn.y - 10); g.lineTo(e.warn.x, e.warn.y + 10); g.stroke();
      }
    }

    prof?.lap('預警');
    // 敵人、晶柱、玩家一起依 y 排序，前後遮擋才自然
    const vis = s.enemies.filter((e) => onScreen(e.x, e.y, e.r * 2));
    if (ter === 'pillars') for (const f of terrainIn('pillars', s.terrainSeed, camX - 60, camY - 40, camX + VW + 60, camY + vh + 90)) vis.push({ pillar: f, y: f.y });
    vis.push({ player: true, y: p.y });
    vis.sort((a, b) => a.y - b.y);
    for (const e of vis) {
      if (e.player) { drawPlayer(g, p.x, p.y, T, p.facing, p.hurtT > 0.4); continue; }
      if (e.pillar) {
        const f = e.pillar, img = makePillar(f.r), k = f.r / (Math.round(f.r / 3) * 3);
        g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 + Math.sin(T * 2 + f.x) * 0.1;
        g.drawImage(G.crystal, f.x - f.r * 1.8, f.y - f.r * 2.4, f.r * 3.6, f.r * 3.6); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
        g.drawImage(img, f.x - img.width / 2 * k, f.y - img.height / 2 * k, img.width * k, img.height * k);
        continue;
      }
      const sp = sprites[e.kind], img = sp.frames[Math.floor(e.frame) % sp.frames.length];
      const k = e.r / ENEMIES[e.kind].r, size = sp.size * k;
      const boss = ENEMIES[e.kind].ai === 'boss';
      if ((e.elite || boss) && !OFF.has('glow')) {
        g.globalCompositeOperation = 'lighter';
        const gl = boss ? G.boss : G['elite_' + e.affix];
        const pr = e.r * (2.2 + Math.sin(T * 5) * 0.15);
        g.globalAlpha = 0.6; g.drawImage(gl, e.x - pr, e.y - pr, pr * 2, pr * 2); g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
      }
      if (e.slowT > 0 && !OFF.has('filter')) g.filter = 'hue-rotate(40deg)';
      g.drawImage(img, e.x - size / 2, e.y - size / 2, size, size);
      g.filter = 'none';
      if (e.flash > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.8; g.drawImage(img, e.x - size / 2, e.y - size / 2, size, size); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
      if (e.elite) { // 精英血條
        const w = e.r * 2;
        g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(e.x - w / 2, e.y - e.r - 12, w, 4);
        g.fillStyle = AFFIX_COLOR[e.affix]; g.fillRect(e.x - w / 2, e.y - e.r - 12, w * Math.max(0, e.hp / e.maxHp), 4);
      }
    }

    prof?.lap('怪物與角色');
    // 子彈、光球、電弧、粒子（加亮疊加）
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round';
    for (const b of s.bullets) {
      if (!onScreen(b.x, b.y)) continue;
      if (b.star) { g.drawImage(G.star, b.x - 14, b.y - 14); g.fillStyle = '#eaffff'; g.beginPath(); g.arc(b.x, b.y, 3, 0, 7); g.fill(); continue; }
      const k = b.big ? 1.8 : b.src === 'shard' ? 0.6 : 1;
      if (!OFF.has('glow')) g.drawImage(G.bolt, b.x - 14 * k, b.y - 14 * k, 28 * k, 28 * k);
      g.strokeStyle = b.big ? 'rgba(255,250,220,0.95)' : 'rgba(255,240,200,0.9)'; g.lineWidth = 3 * k;
      g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.x - b.vx * 0.025 * k, b.y - b.vy * 0.025 * k); g.stroke();
    }
    for (const w of p.weapons) if (w.orbs) for (const o of w.orbs) {
      const r = w.evo ? 26 : 20;
      if (!OFF.has('glow')) g.drawImage(G.orb, o.x - r, o.y - r, r * 2, r * 2);
      g.fillStyle = w.evo ? '#fff' : '#dffaff'; g.beginPath(); g.arc(o.x, o.y, w.evo ? 6 : 4.5, 0, 7); g.fill();
    }
    for (const a of fx.arcs) {
      g.globalAlpha = a.life / 0.18;
      for (const [lw, col] of [[5, 'rgba(160,120,255,0.5)'], [2, 'rgba(235,225,255,1)']]) {
        g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
        for (let i = 0; i < a.pts.length - 1; i++) {
          const [x0, y0] = a.pts[i], [x1, y1] = a.pts[i + 1];
          if (i === 0) g.moveTo(x0, y0);
          for (let j = 1; j <= 4; j++) { const t = j / 4; g.lineTo(x0 + (x1 - x0) * t + (j < 4 ? (Math.random() - 0.5) * 12 : 0), y0 + (y1 - y0) * t + (j < 4 ? (Math.random() - 0.5) * 12 : 0)); }
        }
        g.stroke();
      }
    }
    g.globalAlpha = 1;
    for (const b of s.ebullets) {
      if (!onScreen(b.x, b.y)) continue;
      const r = b.r * 2.6; if (!OFF.has('glow')) g.drawImage(G.spore, b.x - r, b.y - r, r * 2, r * 2);
    }
    g.globalCompositeOperation = 'source-over';
    for (const b of s.ebullets) { if (!onScreen(b.x, b.y)) continue; g.fillStyle = '#ffd6f4'; g.beginPath(); g.arc(b.x, b.y, b.r * 0.6, 0, 7); g.fill(); g.strokeStyle = '#8a1a6a'; g.lineWidth = 1.5; g.stroke(); }
    g.globalCompositeOperation = 'lighter';
    for (const r of fx.rings) {
      const t = 1 - r.life / (r.color === 'magnet' ? 0.5 : 0.35);
      g.strokeStyle = r.color === 'blast' ? `rgba(255,170,80,${r.life * 2.5})` : r.color === 'spore' ? `rgba(255,90,200,${r.life * 2})` : r.color === 'magnet' ? `rgba(120,200,255,${r.life * 2})` : `rgba(255,190,110,${r.life})`;
      g.lineWidth = 3; g.beginPath(); g.arc(r.x, r.y, r.color ? r.r * t : r.r, 0, Math.PI * 2); g.stroke();
    }
    if (!OFF.has('particles')) for (const q of fx.parts) { g.globalAlpha = Math.min(1, q.life / 0.3); g.drawImage(q.img, q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';

    prof?.lap('子彈與特效');
    // 傷害數字
    g.textAlign = 'center';
    for (const q of fx.texts) {
      g.font = q.big ? '800 13px system-ui' : 'bold 10px system-ui';
      g.globalAlpha = Math.min(1, q.life * 3); g.fillStyle = q.big ? '#ffe27a' : '#fff'; g.strokeStyle = '#1a0a22'; g.lineWidth = 2.5;
      g.strokeText(q.v, q.x, q.y); g.fillText(q.v, q.x, q.y);
    }
    g.globalAlpha = 1;

    prof?.lap('飄字');
    // 螢幕空間：霧、暗角、受傷紅框、白閃
    g.setTransform(1, 0, 0, 1, 0, 0);
    if (s.chapter.fog && !OFF.has('fog')) { // 霧：以玩家為中心，瞄準距離外逐漸看不清
      const px = (p.x - camX) * scale, py = (p.y - camY) * scale, R = s.chapter.fog * scale;
      const fg = g.createRadialGradient(px, py, R * 0.55, px, py, R * 1.25);
      fg.addColorStop(0, 'rgba(160,190,175,0)'); fg.addColorStop(0.6, 'rgba(90,120,105,0.45)'); fg.addColorStop(1, 'rgba(40,58,50,0.88)');
      g.fillStyle = fg; g.fillRect(0, 0, W, H);
      g.globalAlpha = 0.18;
      for (let i = 0; i < 5; i++) { // 緩慢飄動的霧團
        const fx0 = ((i * 173 + T * (8 + i * 3)) % (W + 400)) - 200, fy0 = ((i * 311) % H);
        const mg = g.createRadialGradient(fx0, fy0, 0, fx0, fy0, 180 * scale / 2);
        mg.addColorStop(0, 'rgba(200,230,210,0.9)'); mg.addColorStop(1, 'rgba(200,230,210,0)');
        g.fillStyle = mg; g.fillRect(fx0 - 200 * scale, fy0 - 200 * scale, 400 * scale, 400 * scale);
      }
      g.globalAlpha = 1;
    }
    prof?.lap('霧');
    if (!OFF.has('vignette')) {
      const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
      vig.addColorStop(0, 'rgba(5,4,13,0)'); vig.addColorStop(1, 'rgba(5,4,13,0.75)');
      g.fillStyle = vig; g.fillRect(0, 0, W, H);
    }
    const lowHp = p.hp / p.maxHp < 0.3 ? 0.25 + Math.sin(T * 6) * 0.1 : 0;
    const red = Math.max(fx.hurtFlash, lowHp);
    if (red > 0) {
      const rg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.7);
      rg.addColorStop(0, 'rgba(255,0,60,0)'); rg.addColorStop(1, `rgba(255,20,70,${red})`);
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
    }
    if (fx.whiteFlash > 0) { g.fillStyle = `rgba(255,245,220,${fx.whiteFlash * 0.6})`; g.fillRect(0, 0, W, H); }

    prof?.lap('暗角與閃光');
    if (hud) renderHud(g, s, W, H, scale, camX, camY, vh, safeTop); // 主選單背景的展示局不畫 HUD，免得疊到標題
    prof?.lap('HUD');
  }

  function renderHud(g, s, W, H, k, camX, camY, vh, safeTop) {
    const p = s.player, T = s.t;
    g.setTransform(k, 0, 0, k, 0, 0);
    const w = W / k, h = H / k;
    const top = 6 + safeTop; // safeTop：手機瀏海高度（邏輯單位）
    // 經驗條
    g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(0, safeTop, w, 7);
    const xg = g.createLinearGradient(0, 0, w, 0); xg.addColorStop(0, '#4fd8ff'); xg.addColorStop(1, '#b77bff');
    g.fillStyle = xg; g.fillRect(0, safeTop, w * (p.xp / p.xpNext), 7);
    g.font = '700 14px system-ui'; g.fillStyle = '#e9ecff'; g.textAlign = 'left';
    shadowText(g, `Lv ${p.level}`, 10, top + 20);
    // 時間：顯示距離燈塔守衛出現還有多久
    g.textAlign = 'center';
    const left = Math.max(0, s.chapter.bossAt - T);

// 保底推導：設最高稀有度單抽機率 p、保底抽數 N。距離上次最高稀有度的抽數在 N 抽內一定結束，
// 平均間隔 E = Σ_{k=0}^{N-1} (1-p)^k；每個間隔有 (1-p)^{N-1} 的機率是靠保底結束，
// 所以長期下「被保底強制」的抽數比例 f = (1-p)^{N-1} / E；其餘 (1-f) 的抽照表抽。
function gachaOdds(table = GACHA) {

function createPerf(chapterId, sync = false, off = []) {
  const chapter = CHAPTERS.find((c) => c.id === chapterId) ?? CHAPTERS[0];
  // 同步模式沒有垂直同步造成的抖動，樣本少一點就夠（也讓慢的環境量得完）
  const stages = [{ name: '輕場面（開局）', frames: sync ? 100 : 300, skipTo: 0 }, { name: '重場面（第 360 秒）', frames: sync ? 150 : 600, skipTo: 360 }];

  };

      update: { p50: pct(up, 0.5), p99: pct(up, 0.99), max: up.at(-1) }, render: { p50: pct(rd, 0.5), p95: pct(rd, 0.95), p99: pct(rd, 0.99), max: rd.at(-1) }, phases: ph,

    const lines = [`效能量測 第${chapter.id}章 ${chapter.name}｜${sync ? '同步模式' : '一般模式'}${off.length ? `｜關閉：${off.join(',')}` : ''}｜畫布 ${document.getElementById('game').width}×${document.getElementById('game').height}｜螢幕 ${innerWidth}×${innerHeight}、DPR ${devicePixelRatio}`];

        sync ? '幀間隔：同步模式不量（只量繪製成本）' : `平均 ${f1(r.fps)} fps；幀間隔 p50 ${f1(r.iv.p50)}／p95 ${f1(r.iv.p95)}／p99 ${f1(r.iv.p99)}／最慢 ${f1(r.iv.max)} ms；超過 20ms 的幀 ${r.iv.over20}、超過 34ms 的幀 ${r.iv.over34}`,
        `邏輯 p50 ${r.update.p50.toFixed(2)}／p99 ${r.update.p99.toFixed(2)}／最慢 ${r.update.max.toFixed(2)} ms`,
        `繪製 p50 ${f1(r.render.p50)}／p95 ${f1(r.render.p95)}／p99 ${f1(r.render.p99)}／最慢 ${f1(r.render.max)} ms`,
        `繪製細項（平均／p95 ms）：${r.phases.map((p) => `${p.k} ${p.avg.toFixed(2)}/${p.p95.toFixed(2)}`).join('、')}`);

document.getElementById('pauseBtn').addEventListener('click', () => pause());
addEventListener('keydown', (e) => {
  if (e.code !== 'Escape' && e.code !== 'KeyP') return;
  if (paused) { paused = false; input.reset(); sync(); } else pause();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

function pause() { if (mode !== 'run' || sim.state.phase !== 'play') return; paused = true; sync(); }

// 新版 Service Worker 接手後重新載入拿新檔案；遊戲中不打斷，等回主選單再載入。
// 第一次安裝（原本沒有 controller）不需要重載。
let reloadPending = false;
if (navigator.serviceWorker?.controller) {
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (mode === 'menu') location.reload(); else reloadPending = true; });
}

// 主選單背景：無敵、繞圈走、自動挑升級的展示局
function toMenu() {
  if (reloadPending) { location.reload(); return; }
  if (mode !== 'menu' || !sim) {
    mode = 'menu'; paused = false;
    sim = createSim({ seed: 7, vh: H / scale });
    sim.state.god = true;
    renderer = createRenderer(CHAPTER1);
  }
  shown = null; ui.menu(profile, canClaimDaily(profile, Date.now()));
}
function newRun(id) {
  chapterId = id;
  const chapter = CHAPTERS.find((c) => c.id === id);
  mode = 'run'; paused = false; settled = null;
  runSeed = (Math.random() * 2 ** 31) | 0;
  sim = createSim({ seed: runSeed, vh: H / scale, chapter, meta: profileMods(profile) });
  renderer = createRenderer(chapter);
  input.reset(); shown = null; sync();
}

// 一局結束只結算一次：燈油入帳、掉裝備、存檔
function settle() {
  if (settled) return settled;
  const s = sim.state;
  settled = settleRun(profile, { ledger: s.ledger, chapterId, won: s.phase === 'win', t: s.t, kills: s.kills }, makeRng(runSeed ^ 0x9e3779b9));
  persist();
  return settled;
}

// 依 sim 狀態決定要顯示哪個面板（只在狀態改變時重畫 DOM）
function sync() {
  if (mode === 'menu') return;
  const s = sim.state;
  const want = paused ? 'pause' : s.phase;
  if (want === shown) return;
  shown = want;
  if (want === 'choice') ui.levelUp(s.choice);
  else if (want === 'chest') ui.chest(s.chest);
  else if (want === 'pause') ui.pause(s);
  else if (want === 'win' || want === 'lose') { const sum = settle(); setTimeout(() => ui.result(s, sum, profile), want === 'lose' && !s.quit ? 700 : 0); }
  else if (want === 'play') ui.hud();
}

function demoStep(dt) {
  const s = sim.state;
  if (s.phase === 'choice') sim.choose(0);
  if (s.phase === 'chest') sim.closeChest();
  if (s.t > 150) { sim = createSim({ seed: 7, vh: H / scale }); sim.state.god = true; } // 展示局定期重來，避免怪太多
  const a = s.t * 0.35;
  sim.update(dt, { x: Math.cos(a) * 0.6, y: Math.sin(a) * 0.6 });
}

const fps = { frames: 0, acc: 0, value: 0, worst: 0, cur: 0 };
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(raw, 1 / 30); // 分頁切回來時不要一次跳太多
  const t0 = performance.now();
  if (perf) { perfFrame(now, dt); requestAnimationFrame(frame); return; }
  if (mode === 'menu') demoStep(dt);
  else if (!paused) { sim.update(dt, input.move); sync(); }
  renderer.render(g, sim.state, paused || sim.state.phase !== 'play' ? 0 : dt, W, H, scale, safeTop, mode === 'run');
  if (input.stick.active && mode === 'run' && sim.state.phase === 'play' && !paused) drawStick();
  const cost = performance.now() - t0;
  fps.frames++; fps.acc += raw; fps.worst = Math.max(fps.worst, cost);
  if (fps.acc >= 1) { fps.value = fps.frames / fps.acc; fps.cur = fps.worst; fps.frames = 0; fps.acc = 0; fps.worst = 0; }
  if (DEBUG) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.font = `${12 * (W / canvas.clientWidth)}px monospace`; g.fillStyle = '#0f0'; g.textAlign = 'left';
    const s = sim.state;
    g.fillText(`fps ${fps.value.toFixed(0)}  worst ${fps.cur.toFixed(1)}ms  enemies ${s.enemies.length}  bullets ${s.bullets.length}  gems ${s.gems.length}`, 8, H - 10);
  }
  requestAnimationFrame(frame);
}

// 效能量測模式：自動跑、自動選升級；需要快轉時整段只跑邏輯不畫
function perfFrame(now, dt) {
  const s = sim.state;
  const auto = () => { if (s.phase === 'choice') sim.choose(0); if (s.phase === 'chest') sim.closeChest(); };
  if (perf.needsSkip(s)) { for (let i = 0; i < (perf.sync ? 3000 : 600) && s.t < perf.skipTo(perf.stage); i++) { auto(); sim.update(1 / 60, perf.move(s)); s.events.length = 0; } }
  for (let k = 0; k < (perf.sync && !perf.done && !perf.needsSkip(s) ? 30 : 1); k++) {
    auto();
    const step = perf.sync ? 1 / 60 : dt;
    const t0 = performance.now(); sim.update(step, perf.move(s)); const t1 = performance.now();
    renderer.render(g, s, step, W, H, scale, safeTop, true, perf.done ? null : perf.prof);
    if (perf.sync) g.getImageData(0, 0, 1, 1); // 逼 GPU 把這一幀做完，計時才包含真正的繪製
    const t2 = performance.now();
    perf.record(now, t1 - t0, t2 - t1, s);
  }
  const box = document.getElementById('perfBox');
  box.style.display = 'block';
  box.textContent = perf.done ? perf.report.text : `效能量測中…（${perf.stage + 1}/2）第 ${Math.floor(s.t)} 秒`;
}

// 浮動搖桿
function drawStick() {
  const st = input.stick, k = scale;
  g.setTransform(k, 0, 0, k, 0, 0);
  const cssToLogic = (W / canvas.clientWidth) / k;
  const rect = canvas.getBoundingClientRect();
  const ox = (st.ox - rect.left) * cssToLogic, oy = (st.oy - rect.top) * cssToLogic;
  let dx = (st.x - st.ox) * cssToLogic, dy = (st.y - st.oy) * cssToLogic;
  const R = input.RADIUS * cssToLogic, d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  g.fillStyle = 'rgba(255,255,255,0.07)'; g.strokeStyle = 'rgba(255,220,160,0.3)'; g.lineWidth = 2;
  g.beginPath(); g.arc(ox, oy, R, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,230,180,0.55)'; g.beginPath(); g.arc(ox + dx, oy + dy, R * 0.42, 0, Math.PI * 2); g.fill();
}

// 同步量測入口：頁面被判定為隱藏時 rAF 會完全停止，改由外部直接呼叫 window.__perfRun() 一次跑完整段量測
// budget：這次最多跑幾毫秒（沒跑完就回傳進度，再呼叫一次接著跑）
if (perf?.sync) window.__perfRun = (budget = 20000) => {
  const end = performance.now() + budget;
  while (!perf.done && performance.now() < end) perfFrame(performance.now(), 1 / 60);
  return perf.done ? perf.report.text : document.getElementById('perfBox').textContent;
};
if (perf) { // 量測模式不動存檔：用空白進度、無敵、固定 seed
  mode = 'run'; sim = createSim({ seed: 12345, vh: H / scale, chapter: perf.chapter }); sim.state.god = true;
  renderer = createRenderer(perf.chapter); ui.hud(); document.getElementById('pauseBtn').style.display = 'none';
} else toMenu();
if (!perf && LOAD_NOTICE[loaded.status]) ui.toast(LOAD_NOTICE[loaded.status], 6000);
// 升級或修復成功就立刻寫回：否則在玩家做任何動作前，每次開遊戲都會重新升級、重跳提示
if (!perf && loaded.writable && ['migrated', 'repaired', 'corrupt'].includes(loaded.status)) persist();
requestAnimationFrame(frame);

return {  };
})();
</script>
<script>
  // 相對路徑註冊：在 GitHub Pages 子路徑下 scope 自動是該子路徑。換版後的重新載入由 main.js 處理。
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
  }
</script>
