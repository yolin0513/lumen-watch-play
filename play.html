<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>燈芯守望</title>


<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --gold: #ffd27a; --ink: #e9ecff; --dim: #9aa3d6; --panel: rgba(16, 13, 38, 0.92); --edge: rgba(255, 210, 122, 0.35); }
  html, body { margin: 0; height: 100%; background: #05040d; overflow: hidden; color: var(--ink);
    font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; background: #0b0a1a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #pauseBtn { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 8px; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--edge); background: rgba(10, 8, 30, 0.6); font-size: 12px; letter-spacing: -2px; display: none; }
  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 40%, rgba(30, 20, 70, 0.55), rgba(5, 4, 13, 0.88)); text-align: center; }
  .overlay.show { display: flex; animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  h1 { margin: 0; font-size: 44px; letter-spacing: 6px; color: var(--gold);
    text-shadow: 0 0 18px rgba(255, 190, 90, 0.8), 0 0 48px rgba(255, 140, 60, 0.5); }
  h2 { margin: 0 0 14px; font-size: 22px; color: var(--gold); text-shadow: 0 0 12px rgba(255, 190, 90, 0.6); }
  .sub { color: var(--dim); font-size: 14px; margin: 8px 0 28px; line-height: 1.6; }
  .btn { display: block; width: min(280px, 100%); margin: 8px auto; padding: 14px 0; border-radius: 14px; font-size: 17px; font-weight: 700;
    border: 1px solid var(--edge); background: linear-gradient(180deg, #3a2a10, #1c1208); color: var(--gold);
    box-shadow: 0 0 18px rgba(255, 180, 80, 0.25), inset 0 1px 0 rgba(255, 230, 170, 0.25); }
  .btn:active { transform: scale(0.97); }
  .btn.ghost { background: rgba(20, 16, 44, 0.8); color: var(--ink); border-color: rgba(160, 170, 255, 0.3); box-shadow: none; }
  .chapter { width: min(300px, 100%); padding: 14px; margin-bottom: 18px; border-radius: 16px; background: var(--panel); border: 1px solid rgba(143, 232, 255, 0.3);
    box-shadow: 0 0 24px rgba(80, 200, 255, 0.15); }
  .chapter b { color: #8fe8ff; font-size: 18px; } .chapter div { color: var(--dim); font-size: 13px; margin-top: 4px; }
  .cards { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
  .card { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--c, var(--edge)); box-shadow: 0 0 16px color-mix(in srgb, var(--c, #ffd27a) 30%, transparent); }
  .card:active { transform: scale(0.98); }
  .card img { width: 52px; height: 52px; flex: none; }
  .card .t { font-weight: 800; font-size: 16px; } .card .l { font-size: 12px; font-weight: 700; color: var(--c); margin-left: 6px; }
  .card .d { font-size: 13px; color: #cfd6ff; margin-top: 3px; line-height: 1.4; } .card .h { font-size: 11px; color: #ffcf8a; margin-top: 4px; }
  .build { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 22px; max-width: 320px; }
  .build span { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--dim); width: 60px; }
  .build img { width: 40px; height: 40px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 18px; margin: 6px 0 26px; font-size: 15px; }
  .stats dt { color: var(--dim); text-align: right; } .stats dd { margin: 0; text-align: left; font-weight: 700; }
  .win h1 { font-size: 36px; } .lose h1 { font-size: 36px; color: #c9b8ff; text-shadow: 0 0 18px rgba(150, 120, 255, 0.7); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="safeProbe" style="position:absolute;top:0;height:0;padding-top:env(safe-area-inset-top);visibility:hidden;pointer-events:none"></div>
  <button id="pauseBtn" aria-label="暫停">❚❚</button>

  <div id="menu" class="overlay show">
    <h1>燈芯守望</h1>
    <div class="sub">菌潮入夜。提起你的燈，<br>把熄滅的燈塔一座座點回來。</div>
    <div class="chapter"><b>第一章・螢苔原</b><div>撐過 7 分鐘的菌潮，擊敗燈塔守衛</div></div>
    <button class="btn" data-act="start">點燈出發</button>
    <div class="hint">按住畫面任一處拖曳移動・武器自動攻擊<br>桌機：WASD／方向鍵・Esc 暫停</div>
  </div>

  <div id="levelup" class="overlay"><h2>選擇強化</h2><div class="cards"></div></div>

  <div id="chest" class="overlay"><h2>燈核開啟</h2><div class="cards"></div><br><button class="btn" data-act="chestClose">收下</button></div>

  <div id="pause" class="overlay">
    <h2>暫停</h2>
    <div class="build"></div>
    <button class="btn" data-act="resume">繼續</button>
    <button class="btn ghost" data-act="quit">放棄本局</button>
  </div>

  <div id="result" class="overlay">
    <h1></h1><div class="sub"></div>
    <dl class="stats"></dl>
    <button class="btn" data-act="retry">再來一局</button>
    <button class="btn ghost" data-act="menu">回主選單</button>
  </div>
</div>
<script>
"use strict";
// ---- input.js
const __m_input_js = (() => {
// 輸入：浮動虛擬搖桿（觸控/滑鼠按住拖曳）＋鍵盤。輸出統一為 move 向量（長度 0~1）。
function createInput(el) {
  const keys = new Set();
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const RADIUS = 56; // CSS px，搖桿最大半徑

  const down = (id, x, y) => { Object.assign(stick, { active: true, id, ox: x, oy: y, x, y }); };
  const move = (id, x, y) => { if (stick.active && stick.id === id) { stick.x = x; stick.y = y; } };
  const up = (id) => { if (stick.id === id) { stick.active = false; stick.id = null; } };

  el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); down(e.pointerId, e.clientX, e.clientY); e.preventDefault(); });
  el.addEventListener('pointermove', (e) => move(e.pointerId, e.clientX, e.clientY));
  el.addEventListener('pointerup', (e) => up(e.pointerId));
  el.addEventListener('pointercancel', (e) => up(e.pointerId));
  addEventListener('keydown', (e) => keys.add(e.code));
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); stick.active = false; });

  return {
    stick, RADIUS,
    reset() { keys.clear(); stick.active = false; stick.id = null; },
    get move() {
      let x = 0, y = 0;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
      if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
      if (stick.active) {
        const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
        const d = Math.hypot(dx, dy);
        if (d > 6) { const k = Math.min(d, RADIUS) / RADIUS / d; x += dx * k; y += dy * k; }
      }
      const len = Math.hypot(x, y);
      return len > 1 ? { x: x / len, y: y / len } : { x, y };
    },
  };
}

return { createInput };
})();

// ---- content.js
const __m_content_js = (() => {
// 遊戲內容資料：武器、被動、共鳴、怪物、章節時間軸。數值都集中在這裡調。
// 規則在 sim.js；這裡只放資料。所有名稱為本作原創。

// ---- 武器（每把 5 級；lv[i] 是第 i+1 級的完整數值） ----
const WEAPONS = {
  bolt: {
    name: '螢火連弩', color: '#ffd27a',
    desc: ['朝最近的敵人射出光矢', '光矢 +1', '傷害 +40%、穿透 +1', '光矢 +1、射速加快', '光矢 +1、穿透 +1'],
    lv: [
      { dmg: 10, cd: 0.55, shots: 1, pierce: 1, speed: 430 },
      { dmg: 10, cd: 0.55, shots: 2, pierce: 1, speed: 430 },
      { dmg: 14, cd: 0.55, shots: 2, pierce: 2, speed: 430 },
      { dmg: 14, cd: 0.45, shots: 3, pierce: 2, speed: 450 },
      { dmg: 16, cd: 0.45, shots: 4, pierce: 3, speed: 470 },
    ],
  },
  orbit: {
    name: '環燈', color: '#8fe8ff',
    desc: ['光球環繞身邊，撞到敵人造成傷害', '光球 +1', '傷害 +50%、半徑變大', '光球 +1、轉速加快', '光球 +1、傷害 +30%'],
    lv: [
      { dmg: 12, count: 2, radius: 46, spin: 3.0, size: 8 },
      { dmg: 12, count: 3, radius: 46, spin: 3.0, size: 8 },
      { dmg: 18, count: 3, radius: 56, spin: 3.0, size: 9 },
      { dmg: 18, count: 4, radius: 56, spin: 3.8, size: 9 },
      { dmg: 24, count: 5, radius: 60, spin: 3.8, size: 10 },
    ],
  },
  aura: {
    name: '燈暈', color: '#ffb35a',
    desc: ['身邊的暖光持續灼燒敵人', '範圍變大', '傷害 +50%', '範圍變大、灼燒更頻繁', '傷害 +50%、敵人減速'],
    lv: [
      { dmg: 6, radius: 58, tick: 0.5, slow: 0 },
      { dmg: 6, radius: 70, tick: 0.5, slow: 0 },
      { dmg: 9, radius: 70, tick: 0.5, slow: 0 },
      { dmg: 9, radius: 82, tick: 0.4, slow: 0 },
      { dmg: 14, radius: 86, tick: 0.4, slow: 0.35 },
    ],
  },
  chain: {
    name: '雷蕊', color: '#c6a8ff',
    desc: ['電弧擊中敵人後跳向附近目標', '跳躍 +2', '傷害 +50%', '跳躍 +2、充能加快', '同時放出兩道電弧'],
    lv: [
      { dmg: 16, cd: 1.4, jumps: 2, range: 110, arcs: 1 },
      { dmg: 16, cd: 1.4, jumps: 4, range: 110, arcs: 1 },
      { dmg: 24, cd: 1.4, jumps: 4, range: 120, arcs: 1 },
      { dmg: 24, cd: 1.1, jumps: 6, range: 130, arcs: 1 },
      { dmg: 28, cd: 1.1, jumps: 6, range: 130, arcs: 2 },
    ],
  },
};

// ---- 被動（每項 5 級，效果按等級線性疊加） ----
const PASSIVES = {
  lens:  { name: '聚光鏡', color: '#fff0a0', desc: '所有傷害 +10%',       per: { dmgMul: 0.10 } },
  wick:  { name: '快燃芯', color: '#ff8a5c', desc: '攻擊冷卻 -8%',         per: { cdMul: 0.08 } },
  stone: { name: '引光石', color: '#7fd6ff', desc: '拾取範圍 +30%、移速 +4%', per: { magnetMul: 0.30, speedMul: 0.04 } },
  ember: { name: '暖芯',   color: '#ff9fb4', desc: '最大生命 +20、每秒回復 +0.4', per: { maxHp: 20, regen: 0.4 } },
};

// ---- 共鳴：武器滿級＋持有指定被動，開燈核時進化 ----
const RESONANCES = {
  bolt:  { needs: 'wick', name: '流星弩', desc: '巨大的流星光矢貫穿一切，擊殺時迸出碎光',
           stats: { dmg: 24, cd: 0.32, shots: 5, pierce: 99, speed: 520, shard: 3 } },
  orbit: { needs: 'lens', name: '星環',   desc: '光環擴張，並不斷向外拋射星光',
           stats: { dmg: 32, count: 6, radius: 68, spin: 4.4, size: 12, flingCd: 0.6 } },
};

// ---- 怪物 ----
// ai: chase 追擊 / weave 蛇行追擊 / spit 保持距離吐孢 / 其他行為旗標：split 死後分裂
const ENEMIES = {
  mite:     { name: '菌蟎', r: 11, hp: 10, speed: 60,  dmg: 6,  xp: 1, ai: 'chase' },
  moth:     { name: '孢蛾', r: 9,  hp: 7,  speed: 105, dmg: 5,  xp: 1, ai: 'weave' },
  brute:    { name: '刺囊', r: 20, hp: 70, speed: 36,  dmg: 14, xp: 5, ai: 'chase', mass: 4 },
  spitter:  { name: '吐孢菇', r: 13, hp: 24, speed: 50, dmg: 6, xp: 3, ai: 'spit', keep: 150, fireCd: 3.2, shotDmg: 7 },
  splitter: { name: '裂囊', r: 15, hp: 34, speed: 48,  dmg: 8,  xp: 3, ai: 'chase', split: { kind: 'mite', n: 3 } },
  boss1:    { name: '噬燈菌母', r: 42, hp: 40000, speed: 44, dmg: 14, xp: 0, ai: 'boss', mass: 50 },
};

// 精英：放大、加血、帶一個詞綴；死亡必掉燈核
const ELITE = { rMul: 1.6, hpMul: 8, xpMul: 8, dmgMul: 1.2 };
const ELITE_AFFIXES = {
  swift:  { name: '疾速', speedMul: 1.5 },
  regen:  { name: '再生', regen: 0.03 },   // 每秒回復最大生命 3%
  armor:  { name: '硬殼', dmgTaken: 0.6 },
};

// ---- 第一章：螢苔原 ----
// roster：[起始秒, 種類, 權重]；spawnRate(t)：每秒生幾隻；events：固定時間事件
const CHAPTER1 = {
  name: '螢苔原', length: 480, bossAt: 420, arenaR: 250,
  hpScale: (t) => 1 + Math.max(0, t - 60) / 135,  // 怪物血量：第 1 分鐘不成長，之後線性成長
  dmgScale: (t) => 1 + t / 360,                    // 怪物接觸傷害成長
  spawnRate: (t) => 1.2 + t * 0.018 + (t > 240 ? (t - 240) * 0.015 : 0),
  maxEnemies: 300,
  roster: [
    [0, 'mite', 10], [45, 'moth', 5], [150, 'spitter', 2], [210, 'splitter', 3], [270, 'brute', 2], [330, 'moth', 4],
  ],
  events: [
    { at: 90,  type: 'ring',  kind: 'mite', n: 26 },
    { at: 150, type: 'elite', kind: 'brute' },
    { at: 200, type: 'rush',  kind: 'moth', n: 22 },
    { at: 260, type: 'ring',  kind: 'splitter', n: 14 },
    { at: 300, type: 'elite', kind: 'spitter' },
    { at: 345, type: 'rush',  kind: 'moth', n: 30 },
    { at: 370, type: 'elite', kind: 'splitter' },
    { at: 390, type: 'ring',  kind: 'mite', n: 40 },
    { at: 420, type: 'boss',  kind: 'boss1' },
  ],
};

const XP_CURVE = (lv) => Math.round(5 + lv * 4 + lv * lv * 0.3);
const SLOTS = { weapon: 4, passive: 4 };
const MAX_LV = 5;

return { WEAPONS, PASSIVES, RESONANCES, ENEMIES, ELITE, ELITE_AFFIXES, CHAPTER1, XP_CURVE, SLOTS, MAX_LV };
})();

// ---- sim.js
const __m_sim_js = (() => {
// 純邏輯層（不碰 DOM／Canvas）：一整章的規則。Node 可直接 import 測試（tools/sim-test.mjs）。
// 畫面層只讀 state，並消化 state.events 產生特效；介面層呼叫 choose()/closeChest()/pause 相關。
// phase：play 進行中 / choice 升級三選一 / chest 燈核結果 / win / lose（choice、chest、win、lose 時 update 不推進）
const { WEAPONS, PASSIVES, RESONANCES, ENEMIES, ELITE, ELITE_AFFIXES, CHAPTER1, XP_CURVE, SLOTS, MAX_LV } = __m_content_js;
const VW = 400; // 邏輯視野寬度（世界單位），高度依螢幕比例

function makeRng(seed = 1) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 1e6) / 1e6; };
}

const TAU = Math.PI * 2;
const BASE = { hp: 100, speed: 120, magnet: 95 };
const GEM_DRIFT = { range: 220, speed: 28 }; // 附近的光屑會緩慢飄向玩家，站著不動也撿得到一些

function createSim({ seed = 1, vh = 700, chapter = CHAPTER1 } = {}) {
  const rand = makeRng(seed);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const s = {
    t: 0, phase: 'play', kills: 0, vh, chapter,
    player: {
      x: 0, y: 0, hp: BASE.hp, maxHp: BASE.hp, speed: BASE.speed, magnet: BASE.magnet, regen: 0, dmgMul: 1, cdMul: 1,
      facing: 1, hurtT: 0, level: 1, xp: 0, xpNext: XP_CURVE(1), weapons: [], passives: {},
    },
    enemies: [], bullets: [], ebullets: [], gems: [], pickups: [],
    events: [],        // 給畫面層的一次性事件
    pendingLevels: 0, choice: null, chest: null,
    spawnAcc: 0, eventIdx: 0, boss: null, arena: null, winT: 0,
    autoSpawn: true, god: false, // 測試用
  };
  const p = s.player;

  // ---------- 成長 ----------
  function recalc() {
    const sum = (key) => Object.entries(p.passives).reduce((a, [id, l]) => a + (PASSIVES[id].per[key] || 0) * l, 0);
    p.dmgMul = 1 + sum('dmgMul');
    p.cdMul = Math.max(0.4, 1 - sum('cdMul'));
    p.magnet = BASE.magnet * (1 + sum('magnetMul'));
    p.speed = BASE.speed * (1 + sum('speedMul'));
    const maxHp = BASE.hp + sum('maxHp');
    p.hp += maxHp - p.maxHp; p.maxHp = maxHp;
    p.regen = sum('regen');
  }
  function weaponStats(w) { return w.evo ? RESONANCES[w.id].stats : WEAPONS[w.id].lv[w.lv - 1]; }
  function addWeapon(id) { const w = { id, lv: 1, evo: false, cd: 0.2, ang: 0, fling: 0 }; p.weapons.push(w); return w; }
  function canEvolve(w) { const r = RESONANCES[w.id]; return r && !w.evo && w.lv >= MAX_LV && (p.passives[r.needs] || 0) > 0; }

  function options() {
    const out = [];
    const ownW = new Set(p.weapons.map((w) => w.id));
    for (const w of p.weapons) if (!w.evo && w.lv < MAX_LV) out.push({ kind: 'wup', id: w.id, from: w.lv });
    if (p.weapons.length < SLOTS.weapon) for (const id of Object.keys(WEAPONS)) if (!ownW.has(id)) out.push({ kind: 'wnew', id, from: 0 });
    const ownP = Object.keys(p.passives);
    for (const id of ownP) if (p.passives[id] < MAX_LV) out.push({ kind: 'pup', id, from: p.passives[id] });
    if (ownP.length < SLOTS.passive) for (const id of Object.keys(PASSIVES)) if (!p.passives[id]) out.push({ kind: 'pnew', id, from: 0 });
    return out;
  }
  function describe(o) {
    if (o.kind === 'heal') return { ...o, name: '溫熱燈油', color: '#ff9fb4', icon: 'heal', label: '恢復', desc: '立即回復 40 生命' };
    const isW = o.kind === 'wup' || o.kind === 'wnew';
    const def = isW ? WEAPONS[o.id] : PASSIVES[o.id];
    const desc = isW ? def.desc[o.from] : def.desc;
    let hint = '';
    if (isW && RESONANCES[o.id]) hint = `滿級＋${PASSIVES[RESONANCES[o.id].needs].name} → 共鳴「${RESONANCES[o.id].name}」`;
    if (!isW) for (const [wid, r] of Object.entries(RESONANCES)) if (r.needs === o.id) hint = `與 ${WEAPONS[wid].name} 共鳴`;
    return { ...o, name: def.name, color: def.color, icon: o.id, label: o.from === 0 ? '新！' : `Lv ${o.from} → ${o.from + 1}`, desc, hint };
  }
  function rollChoices() {
    const pool = options();
    const picked = [];
    while (picked.length < 3 && pool.length) picked.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
    if (picked.length < 3) picked.push({ kind: 'heal', id: 'heal', from: 0 });
    return picked.map(describe);
  }
  function apply(o) {
    if (o.kind === 'wnew') addWeapon(o.id);
    else if (o.kind === 'wup') p.weapons.find((w) => w.id === o.id).lv++;
    else if (o.kind === 'pnew' || o.kind === 'pup') { p.passives[o.id] = (p.passives[o.id] || 0) + 1; recalc(); }
    else if (o.kind === 'heal') p.hp = Math.min(p.maxHp, p.hp + 40);
  }
  function choose(i) {
    if (s.phase !== 'choice') return;
    apply(s.choice[i]);
    s.pendingLevels--; s.choice = null; s.phase = 'play';
    nextChoice();
  }
  function nextChoice() {
    if (s.phase === 'play' && s.pendingLevels > 0) { s.choice = rollChoices(); s.phase = 'choice'; }
  }
  function gainXp(v) {
    p.xp += v;
    while (p.xp >= p.xpNext) {
      p.xp -= p.xpNext; p.level++; p.xpNext = XP_CURVE(p.level); s.pendingLevels++;
      s.events.push({ type: 'level', x: p.x, y: p.y });
    }
  }

  // 燈核：有可共鳴武器就進化，否則隨機強化最多 3 項已持有的東西
  function openChest() {
    const evo = p.weapons.find(canEvolve);
    let result;
    if (evo) {
      evo.evo = true;
      const r = RESONANCES[evo.id];
      result = { type: 'evo', items: [{ name: r.name, color: WEAPONS[evo.id].color, icon: evo.id, label: '共鳴！', desc: r.desc }] };
    } else {
      const ups = options().filter((o) => o.kind === 'wup' || o.kind === 'pup');
      const items = [];
      for (let i = 0; i < 3 && ups.length; i++) { const o = ups.splice(Math.floor(rand() * ups.length), 1)[0]; items.push(describe(o)); apply(o); }
      if (!items.length) { const h = describe({ kind: 'heal', id: 'heal', from: 0 }); apply(h); items.push(h); }
      result = { type: 'upgrade', items };
    }
    s.chest = result; s.phase = 'chest';
    s.events.push({ type: 'chest', x: p.x, y: p.y });
  }
  function closeChest() { if (s.phase !== 'chest') return; s.chest = null; s.phase = 'play'; nextChoice(); }

  // ---------- 生怪 ----------
  function spawnDist() { return Math.hypot(VW, s.vh) / 2 + 30; }
  function spawnEnemy(kind, { angle, dist, x, y, elite = false, affix = null } = {}) {
    const t = ENEMIES[kind];
    const a = angle ?? rand() * TAU;
    const d = dist ?? spawnDist();
    const hpMul = (kind === 'boss1' ? 1 : s.chapter.hpScale(s.t)) * (elite ? ELITE.hpMul : 1);
    const e = {
      kind, elite, affix, x: x ?? p.x + Math.cos(a) * d, y: y ?? p.y + Math.sin(a) * d,
      r: t.r * (elite ? ELITE.rMul : 1), hp: t.hp * hpMul, maxHp: t.hp * hpMul, mass: (t.mass || 1) * (elite ? 6 : 1),
      flash: 0, frame: rand() * 4, seed: rand() * 100, slowT: 0, slow: 0, orbT: 0, fireT: (t.fireCd || 0) * (0.5 + rand()),
    };
    if (kind === 'boss1') Object.assign(e, { bphase: 1, burstT: 2, dashT: 4, summonT: 0, mode: 'move', modeT: 0, dirX: 0, dirY: 0 });
    s.enemies.push(e);
    return e;
  }
  function rosterPick() {
    const list = s.chapter.roster.filter(([at]) => s.t >= at);
    let total = 0; for (const r of list) total += r[2];
    let x = rand() * total;
    for (const r of list) { x -= r[2]; if (x <= 0) return r[1]; }
    return list[0][1];
  }
  function runEvent(ev) {
    if (ev.type === 'ring') for (let i = 0; i < ev.n; i++) spawnEnemy(ev.kind, { angle: (i / ev.n) * TAU });
    else if (ev.type === 'rush') {
      const a = rand() * TAU, d = spawnDist(), cx = p.x + Math.cos(a) * d, cy = p.y + Math.sin(a) * d;
      for (let i = 0; i < ev.n; i++) { const off = (i / (ev.n - 1) - 0.5) * 360; spawnEnemy(ev.kind, { x: cx - Math.sin(a) * off, y: cy + Math.cos(a) * off }); }
    } else if (ev.type === 'elite') {
      const affix = pick(Object.keys(ELITE_AFFIXES));
      spawnEnemy(ev.kind, { elite: true, affix });
      s.events.push({ type: 'announce', text: `精英出現：${ELITE_AFFIXES[affix].name}${ENEMIES[ev.kind].name}` });
    } else if (ev.type === 'boss') startBoss(ev.kind);
    s.events.push({ type: 'wave', kind: ev.type });
  }
  function startBoss(kind) {
    s.arena = { x: p.x, y: p.y, r: s.chapter.arenaR };
    // 光圈外的怪直接消散（不給經驗）
    s.enemies = s.enemies.filter((e) => {
      const inside = Math.hypot(e.x - s.arena.x, e.y - s.arena.y) < s.arena.r - 10;
      if (!inside) s.events.push({ type: 'fade', x: e.x, y: e.y });
      return inside;
    });
    s.ebullets.length = 0;
    s.boss = spawnEnemy(kind, { x: p.x, y: p.y - s.arena.r * 0.7 });
    s.events.push({ type: 'announce', text: `燈塔守衛：${ENEMIES[kind].name}`, big: true });
  }

  // ---------- 空間雜湊 ----------
  const CELL = 48;
  let grid = new Map();
  const key = (cx, cy) => cx * 73856093 ^ cy * 19349663;
  function buildGrid() {
    grid = new Map();
    for (const e of s.enemies) {
      const k = key(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
      let b = grid.get(k); if (!b) grid.set(k, b = []); b.push(e);
    }
  }
  function near(x, y, fn, rad = 1) {
    const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    for (let i = -rad; i <= rad; i++) for (let j = -rad; j <= rad; j++) { const b = grid.get(key(cx + i, cy + j)); if (b) for (const e of b) fn(e); }
  }
  function nearest(x, y, maxD, skip) {
    let best = null, bd = maxD * maxD;
    for (const e of s.enemies) {
      if (e.hp <= 0 || (skip && skip.has(e))) continue;
      const d2 = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d2 < bd) { bd = d2; best = e; }
    }
    return best;
  }

  // ---------- 傷害 ----------
  function damage(e, amount, kx = 0, ky = 0) {
    if (e.hp <= 0) return;
    const aff = e.affix && ELITE_AFFIXES[e.affix];
    const dmg = Math.max(1, Math.round(amount * p.dmgMul * (aff?.dmgTaken ?? 1)));
    e.hp -= dmg; e.flash = 0.08;
    if (e.kind !== 'boss1') { e.x += kx * 6 / e.mass; e.y += ky * 6 / e.mass; }
    s.events.push({ type: 'hit', x: e.x, y: e.y - e.r, v: dmg, big: dmg >= 30 });
  }
  function hurtPlayer(dmg, src) {
    if (p.hurtT > 0 || s.god || s.phase !== 'play') return;
    p.hp -= dmg; p.hurtT = 0.5;
    s.events.push({ type: 'hurt', x: p.x, y: p.y, v: dmg, src });
    if (p.hp <= 0) { p.hp = 0; s.phase = 'lose'; s.events.push({ type: 'lose' }); }
  }

  // ---------- 武器 ----------
  function fireBolt(w, st, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const target = nearest(p.x, p.y, 420);
    if (!target) return;
    w.cd = st.cd * p.cdMul;
    const base = Math.atan2(target.y - p.y, target.x - p.x);
    for (let i = 0; i < st.shots; i++) {
      const a = base + (i - (st.shots - 1) / 2) * 0.14;
      s.bullets.push({ x: p.x, y: p.y, vx: Math.cos(a) * st.speed, vy: Math.sin(a) * st.speed, life: 1.1, dmg: st.dmg, pierce: st.pierce, hit: new Set(), shard: st.shard || 0, big: !!w.evo, src: 'bolt' });
    }
  }
  function orbitWeapon(w, st, dt) {
    w.ang += st.spin * dt;
    w.orbs = [];
    for (let i = 0; i < st.count; i++) {
      const a = w.ang + (i / st.count) * TAU;
      const ox = p.x + Math.cos(a) * st.radius, oy = p.y + Math.sin(a) * st.radius;
      w.orbs.push({ x: ox, y: oy, a });
      near(ox, oy, (e) => {
        if (e.orbT > 0 || e.hp <= 0) return;
        if ((e.x - ox) ** 2 + (e.y - oy) ** 2 < (e.r + st.size) ** 2) { e.orbT = 0.4; damage(e, st.dmg, Math.cos(a), Math.sin(a)); }
      });
    }
    if (st.flingCd) {
      w.fling -= dt;
      if (w.fling <= 0) {
        w.fling = st.flingCd * p.cdMul;
        const o = w.orbs[Math.floor(rand() * w.orbs.length)];
        s.bullets.push({ x: o.x, y: o.y, vx: Math.cos(o.a) * 300, vy: Math.sin(o.a) * 300, life: 1.2, dmg: st.dmg * 0.6, pierce: 3, hit: new Set(), shard: 0, star: true, src: 'orbit' });
      }
    }
  }
  function auraWeapon(w, st, dt) {
    w.cd -= dt;
    w.radius = st.radius;
    if (w.cd > 0) return;
    w.cd = st.tick * p.cdMul;
    near(p.x, p.y, (e) => {
      if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < (st.radius + e.r) ** 2) {
        damage(e, st.dmg);
        if (st.slow) { e.slowT = 0.6; e.slow = st.slow; }
      }
    }, Math.ceil(st.radius / CELL) + 1);
    s.events.push({ type: 'aura', x: p.x, y: p.y, r: st.radius });
  }
  function chainWeapon(w, st, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const first = nearest(p.x, p.y, 260);
    if (!first) return;
    w.cd = st.cd * p.cdMul;
    const hit = new Set();
    for (let k = 0; k < st.arcs; k++) {
      let cur = k === 0 ? first : nearest(p.x, p.y, 260, hit);
      if (!cur) break;
      const pts = [[p.x, p.y]];
      for (let j = 0; j <= st.jumps && cur; j++) {
        hit.add(cur); pts.push([cur.x, cur.y]);
        damage(cur, st.dmg);
        cur = nearest(cur.x, cur.y, st.range, hit);
      }
      s.events.push({ type: 'arc', pts });
    }
  }
  const WEAPON_FN = { bolt: fireBolt, orbit: orbitWeapon, aura: auraWeapon, chain: chainWeapon };

  // ---------- 敵人行為 ----------
  function enemyMove(e, dt) {
    const t = ENEMIES[e.kind];
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    let spd = t.speed * (e.affix === 'swift' ? ELITE_AFFIXES.swift.speedMul : 1) * (e.slowT > 0 ? 1 - e.slow : 1);
    let vx = ux, vy = uy;
    if (t.ai === 'weave') { const w = Math.sin(s.t * 4 + e.seed) * 0.7; vx = ux - uy * w; vy = uy + ux * w; }
    else if (t.ai === 'spit') {
      const dir = d > t.keep + 20 ? 1 : d < t.keep - 20 ? -0.8 : 0;
      const side = Math.sin(e.seed) > 0 ? 1 : -1;
      vx = ux * dir - uy * side * 0.5; vy = uy * dir + ux * side * 0.5;
      e.fireT -= dt;
      if (e.fireT <= 0 && d < 320) {
        e.fireT = t.fireCd;
        s.ebullets.push({ x: e.x, y: e.y, vx: ux * 110, vy: uy * 110, life: 4, dmg: t.shotDmg * (e.elite ? ELITE.dmgMul : 1), r: e.elite ? 8 : 5 });
        if (e.elite) for (const off of [-0.35, 0.35]) { const c = Math.cos(off), sn = Math.sin(off); s.ebullets.push({ x: e.x, y: e.y, vx: (ux * c - uy * sn) * 110, vy: (uy * c + ux * sn) * 110, life: 4, dmg: t.shotDmg, r: 6 }); }
      }
    } else if (t.ai === 'boss') return bossAct(e, dt, ux, uy, d);
    const len = Math.hypot(vx, vy) || 1;
    return [vx / len * spd, vy / len * spd];
  }
  function radial(e, n, speed, offset, dmg) {
    for (let i = 0; i < n; i++) { const a = offset + (i / n) * TAU; s.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 5, dmg, r: 7 }); }
  }
  function bossAct(e, dt, ux, uy) {
    const t = ENEMIES[e.kind];
    const frac = e.hp / e.maxHp;
    const phase = frac > 0.6 ? 1 : frac > 0.25 ? 2 : 3;
    if (phase !== e.bphase) {
      e.bphase = phase;
      s.events.push({ type: 'announce', text: phase === 2 ? '菌母暴躁起來了！' : '菌母孢雨狂亂！' });
      if (phase === 2) e.summonT = 0;
    }
    e.burstT -= dt;
    if (e.burstT <= 0) {
      e.burstT = phase === 3 ? 1.6 : 3;
      radial(e, phase === 1 ? 12 : 16, phase === 3 ? 115 : 100, phase === 3 ? s.t * 1.7 : rand() * TAU, 10);
      s.events.push({ type: 'burst', x: e.x, y: e.y });
    }
    if (phase >= 2) {
      e.summonT -= dt;
      if (e.summonT <= 0) {
        e.summonT = 11;
        for (let i = 0; i < 6; i++) spawnEnemy('mite', { x: e.x + Math.cos(i) * 50, y: e.y + Math.sin(i) * 50 });
      }
    }
    e.modeT -= dt;
    if (e.mode === 'move') {
      if (phase >= 2) e.dashT -= dt;
      if (e.dashT <= 0) { e.mode = 'windup'; e.modeT = 0.9; e.dirX = ux; e.dirY = uy; e.dashT = phase === 3 ? 3.5 : 5; }
      return [ux * t.speed, uy * t.speed];
    }
    if (e.mode === 'windup') { e.tele = { dx: e.dirX, dy: e.dirY, len: 330 }; if (e.modeT <= 0) { e.mode = 'dash'; e.modeT = 0.55; e.tele = null; } return [0, 0]; }
    if (e.modeT <= 0) e.mode = 'move';
    return [e.dirX * 600, e.dirY * 600];
  }

  // ---------- 主更新 ----------
  function update(dt, move) {
    if (s.phase !== 'play') return;
    s.t += dt;
    const ch = s.chapter;

    // 玩家
    p.x += move.x * p.speed * dt; p.y += move.y * p.speed * dt;
    if (move.x) p.facing = move.x > 0 ? 1 : -1;
    if (s.arena) clampArena(p, 14);
    p.hurtT = Math.max(0, p.hurtT - dt);
    if (p.regen) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);

    // 生怪與時間軸事件
    while (s.eventIdx < ch.events.length && s.t >= ch.events[s.eventIdx].at) runEvent(ch.events[s.eventIdx++]);
    if (s.autoSpawn && !s.boss) {
      s.spawnAcc += dt * ch.spawnRate(s.t);
      while (s.spawnAcc >= 1) { s.spawnAcc -= 1; if (s.enemies.length < ch.maxEnemies) spawnEnemy(rosterPick()); }
    }

    buildGrid();

    // 敵人移動＋互推＋接觸傷害
    for (const e of s.enemies) {
      const [vx, vy] = enemyMove(e, dt);
      let sx = 0, sy = 0;
      near(e.x, e.y, (o) => {
        if (o === e) return;
        const ox = e.x - o.x, oy = e.y - o.y, od = ox * ox + oy * oy, min = e.r + o.r;
        if (od < min * min && od > 0.01) { const k = (min - Math.sqrt(od)) / min * (o.mass / (e.mass + o.mass)) * 2; sx += ox * k; sy += oy * k; }
      });
      e.x += (vx + sx * 4) * dt; e.y += (vy + sy * 4) * dt;
      if (s.arena) clampArena(e, e.r);
      e.frame += dt * 6; e.flash = Math.max(0, e.flash - dt); e.orbT -= dt; e.slowT -= dt;
      if (e.affix === 'regen') e.hp = Math.min(e.maxHp, e.hp + e.maxHp * ELITE_AFFIXES.regen.regen * dt);
      const d2 = (p.x - e.x) ** 2 + (p.y - e.y) ** 2;
      if (d2 < (e.r + 10) ** 2) hurtPlayer(Math.round(ENEMIES[e.kind].dmg * (e.elite ? ELITE.dmgMul : 1) * ch.dmgScale(s.t)), (e.elite ? 'elite-' : '') + e.kind);
    }

    // 武器
    for (const w of p.weapons) WEAPON_FN[w.id](w, weaponStats(w), dt);

    // 玩家子彈
    for (const b of s.bullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (b.life <= 0) continue;
      near(b.x, b.y, (e) => {
        if (b.life <= 0 || e.hp <= 0 || b.hit.has(e)) return;
        const rr = e.r + (b.big ? 9 : 4);
        if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) {
          b.hit.add(e);
          const sp = Math.hypot(b.vx, b.vy);
          damage(e, b.dmg, b.vx / sp, b.vy / sp);
          if (e.hp <= 0 && b.shard) for (let i = 0; i < b.shard; i++) { const a = rand() * TAU; s.bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.45, dmg: b.dmg * 0.5, pierce: 1, hit: new Set([e]), shard: 0, src: 'shard' }); }
          if (--b.pierce <= 0) b.life = 0;
        }
      });
    }
    s.bullets = s.bullets.filter((b) => b.life > 0);

    // 敵方子彈
    for (const b of s.ebullets) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r + 8) ** 2) { hurtPlayer(b.dmg, 'spore'); b.life = 0; }
    }
    s.ebullets = s.ebullets.filter((b) => b.life > 0);

    // 死亡：經驗、掉落、分裂
    const dead = s.enemies.filter((e) => e.hp <= 0);
    if (dead.length) {
      s.enemies = s.enemies.filter((e) => e.hp > 0);
      for (const e of dead) onKill(e);
    }

    // 離太遠的怪移回附近（不在競技場時）
    if (!s.arena) {
      const far = Math.hypot(VW, s.vh) * 0.9;
      for (const e of s.enemies) if (!e.elite && Math.hypot(e.x - p.x, e.y - p.y) > far) { const a = rand() * TAU; e.x = p.x + Math.cos(a) * spawnDist(); e.y = p.y + Math.sin(a) * spawnDist(); }
    }

    // 經驗晶
    for (const g of s.gems) {
      const dx = p.x - g.x, dy = p.y - g.y, d = Math.hypot(dx, dy);
      if (d < p.magnet) g.pull = true;
      else if (d < GEM_DRIFT.range) { g.x += dx / d * GEM_DRIFT.speed * dt; g.y += dy / d * GEM_DRIFT.speed * dt; }
      if (g.pull && d > 0) { g.sp = Math.min(700, (g.sp || 200) + 900 * dt); const v = Math.min(d, g.sp * dt); g.x += dx / d * v; g.y += dy / d * v; }
      if (d < 16) { gainXp(g.v); g.v = 0; }
    }
    s.gems = s.gems.filter((g) => g.v > 0);
    if (s.gems.length > 350) mergeGems();

    // 道具
    for (const it of s.pickups) {
      const d = Math.hypot(p.x - it.x, p.y - it.y);
      if (d < 22) {
        it.taken = true;
        if (it.type === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 30); s.events.push({ type: 'heal', x: p.x, y: p.y }); }
        else if (it.type === 'magnet') { for (const g of s.gems) g.pull = true; s.events.push({ type: 'magnet', x: p.x, y: p.y }); }
        else if (it.type === 'chest') openChest();
      }
    }
    s.pickups = s.pickups.filter((it) => !it.taken);

    // 勝利：Boss 倒下後稍等一下讓玩家看到爆炸
    if (s.winT > 0) { s.winT -= dt; if (s.winT <= 0) { s.phase = 'win'; s.events.push({ type: 'win' }); } }

    if (s.phase === 'play') nextChoice();
  }

  function clampArena(o, pad) {
    const dx = o.x - s.arena.x, dy = o.y - s.arena.y, d = Math.hypot(dx, dy), max = s.arena.r - pad;
    if (d > max) { o.x = s.arena.x + dx / d * max; o.y = s.arena.y + dy / d * max; }
  }

  function onKill(e) {
    const t = ENEMIES[e.kind];
    s.kills++;
    s.events.push({ type: 'kill', x: e.x, y: e.y, kind: e.kind, elite: e.elite });
    if (e.kind === 'boss1') {
      s.boss = null; s.winT = 1.8; s.god = true;
      for (const o of s.enemies) { o.hp = 0; s.events.push({ type: 'fade', x: o.x, y: o.y }); }
      s.enemies = []; s.ebullets = [];
      s.events.push({ type: 'bossdown', x: e.x, y: e.y });
      return;
    }
    s.gems.push({ x: e.x, y: e.y, v: t.xp * (e.elite ? ELITE.xpMul : 1), pull: false });
    if (e.elite) s.pickups.push({ type: 'chest', x: e.x, y: e.y });
    else {
      const r = rand();
      if (r < 0.006) s.pickups.push({ type: 'heal', x: e.x, y: e.y });
      else if (r < 0.009) s.pickups.push({ type: 'magnet', x: e.x, y: e.y });
    }
    if (t.split) for (let i = 0; i < t.split.n; i++) {
      const a = (i / t.split.n) * TAU;
      const m = spawnEnemy(t.split.kind, { x: e.x + Math.cos(a) * 12, y: e.y + Math.sin(a) * 12 });
      m.r *= 0.8; m.hp = m.maxHp = m.hp * 0.6;
    }
  }

  // 經驗晶太多時，把最遠的併到最近的一顆（保持總經驗不變）
  function mergeGems() {
    s.gems.sort((a, b) => ((a.x - p.x) ** 2 + (a.y - p.y) ** 2) - ((b.x - p.x) ** 2 + (b.y - p.y) ** 2));
    const keep = s.gems.slice(0, 250), extra = s.gems.slice(250);

  navigator.serviceWorker.addEventListener('controllerchange', () => { if (mode === 'menu') location.reload(); else reloadPending = true; });
}

// 主選單背景：無敵、繞圈走、自動挑升級的展示局
function toMenu() {
  if (reloadPending) { location.reload(); return; }
  mode = 'menu'; paused = false;
  sim = createSim({ seed: 7, vh: H / scale });
  sim.state.god = true;
  renderer = createRenderer();
  shown = null; ui.menu();
}
function newRun() {
  mode = 'run'; paused = false;
  sim = createSim({ seed: (Math.random() * 2 ** 31) | 0, vh: H / scale });
  renderer = createRenderer();
  input.reset(); shown = null; sync();
}

// 依 sim 狀態決定要顯示哪個面板（只在狀態改變時重畫 DOM）
function sync() {
  const s = sim.state;
  const want = mode === 'menu' ? 'menu' : paused ? 'pause' : s.phase;
  if (want === shown) return;
  shown = want;
  if (want === 'choice') ui.levelUp(s.choice);
  else if (want === 'chest') ui.chest(s.chest);
  else if (want === 'pause') ui.pause(s);
  else if (want === 'win' || want === 'lose') setTimeout(() => ui.result(s), want === 'lose' ? 700 : 0);
  else if (want === 'play') ui.hud();
}

function demoStep(dt) {
  const s = sim.state;
  if (s.phase === 'choice') sim.choose(0);
  if (s.phase === 'chest') sim.closeChest();
  if (s.t > 150) toMenu(); // 展示局定期重來，避免怪太多
  const a = s.t * 0.35;
  sim.update(dt, { x: Math.cos(a) * 0.6, y: Math.sin(a) * 0.6 });
}

const fps = { frames: 0, acc: 0, value: 0, worst: 0, cur: 0 };
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(raw, 1 / 30); // 分頁切回來時不要一次跳太多
  const t0 = performance.now();
  if (mode === 'menu') demoStep(dt);
  else if (!paused) { sim.update(dt, input.move); sync(); }
  renderer.render(g, sim.state, paused || sim.state.phase !== 'play' ? 0 : dt, W, H, scale, safeTop);
  if (input.stick.active && mode === 'run' && sim.state.phase === 'play' && !paused) drawStick();
  const cost = performance.now() - t0;
  fps.frames++; fps.acc += raw; fps.worst = Math.max(fps.worst, cost);
  if (fps.acc >= 1) { fps.value = fps.frames / fps.acc; fps.cur = fps.worst; fps.frames = 0; fps.acc = 0; fps.worst = 0; }
  if (DEBUG) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.font = `${12 * (W / canvas.clientWidth)}px monospace`; g.fillStyle = '#0f0'; g.textAlign = 'left';
    const s = sim.state;
    g.fillText(`fps ${fps.value.toFixed(0)}  worst ${fps.cur.toFixed(1)}ms  enemies ${s.enemies.length}  bullets ${s.bullets.length}  gems ${s.gems.length}`, 8, H - 10);
  }
  requestAnimationFrame(frame);
}

// 浮動搖桿
function drawStick() {
  const st = input.stick, k = scale;
  g.setTransform(k, 0, 0, k, 0, 0);
  const cssToLogic = (W / canvas.clientWidth) / k;
  const rect = canvas.getBoundingClientRect();
  const ox = (st.ox - rect.left) * cssToLogic, oy = (st.oy - rect.top) * cssToLogic;
  let dx = (st.x - st.ox) * cssToLogic, dy = (st.y - st.oy) * cssToLogic;
  const R = input.RADIUS * cssToLogic, d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  g.fillStyle = 'rgba(255,255,255,0.07)'; g.strokeStyle = 'rgba(255,220,160,0.3)'; g.lineWidth = 2;
  g.beginPath(); g.arc(ox, oy, R, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,230,180,0.55)'; g.beginPath(); g.arc(ox + dx, oy + dy, R * 0.42, 0, Math.PI * 2); g.fill();
}

toMenu();
requestAnimationFrame(frame);

return {  };
})();
</script>
