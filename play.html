<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>燈芯守望</title>
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root { --gold: #ffd27a; --ink: #e9ecff; --dim: #9aa3d6; --panel: rgba(16, 13, 38, 0.92); --edge: rgba(255, 210, 122, 0.35); }
  html, body { margin: 0; height: 100%; background: #05040d; overflow: hidden; color: var(--ink);
    font-family: system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: relative; height: 100%; max-width: 520px; margin: 0 auto; background: #0b0a1a; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }

  /* 暫停鍵：兩條直線用 SVG 畫，不靠字型 */
  #pauseBtn { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 8px; width: 36px; height: 36px; border-radius: 50%; padding: 0;
    border: 1px solid var(--edge); background: rgba(10, 8, 30, 0.6); display: none; align-items: center; justify-content: center; }
  #pauseBtn svg { width: 14px; height: 14px; display: block; }
  /* 倍速鍵：在暫停鍵左邊；不是 1 倍時亮起來，提醒玩家目前在加速 */
  #speedBtn { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 52px; min-width: 44px; height: 36px; border-radius: 18px; padding: 0 8px;
    border: 1px solid var(--edge); background: rgba(10, 8, 30, 0.6); display: none; align-items: center; justify-content: center; color: var(--gold); font-weight: 800; font-size: 14px; }
  #speedBtn.fast { background: rgba(255, 190, 90, 0.25); border-color: #ffd27a; }

  .overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px); box-sizing: border-box;
    background: radial-gradient(ellipse at 50% 40%, rgba(30, 20, 70, 0.55), rgba(5, 4, 13, 0.88)); text-align: center; }
  .overlay.show { display: flex; animation: fadeIn .25s ease-out; }
  .overlay.scroll { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  .overlay.scroll > * { flex: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  h1 { margin: 0; font-size: 44px; letter-spacing: 6px; color: var(--gold);
    text-shadow: 0 0 18px rgba(255, 190, 90, 0.8), 0 0 48px rgba(255, 140, 60, 0.5); }
  h2 { margin: 0 0 12px; font-size: 22px; color: var(--gold); text-shadow: 0 0 12px rgba(255, 190, 90, 0.6); }
  .sub { color: var(--dim); font-size: 14px; margin: 8px 0 18px; line-height: 1.6; }
  .btn { display: block; width: min(280px, 100%); margin: 8px auto; padding: 14px 0; border-radius: 14px; font-size: 17px; font-weight: 700;
    border: 1px solid var(--edge); background: linear-gradient(180deg, #3a2a10, #1c1208); color: var(--gold);
    box-shadow: 0 0 18px rgba(255, 180, 80, 0.25), inset 0 1px 0 rgba(255, 230, 170, 0.25); }
  .btn:active { transform: scale(0.97); }
  /* 按鈕回饋：只用 transform／opacity（交給合成器做，不觸發重排） */
  button { transition: transform .08s ease-out; -webkit-tap-highlight-color: transparent; }
  button:not(:disabled):active { transform: scale(0.94); }
  .fx-flash { position: relative; }
  .fx-flash::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255, 220, 140, 0.55), rgba(255, 200, 100, 0.12) 70%); animation: fxFlash .7s ease-out; }
  @keyframes fxFlash { 0% { opacity: 1; } 100% { opacity: 0; } }
  .fx-bump { display: inline-block; animation: fxBump .45s ease-out; }
  @keyframes fxBump { 0% { transform: scale(1); } 30% { transform: scale(1.35); } 100% { transform: scale(1); } }
  .money { position: relative; display: inline-block; }
  .fx-delta { position: absolute; right: 0; top: -2px; font-style: normal; font-size: 12px; font-weight: 700; pointer-events: none; white-space: nowrap;
    opacity: 0; animation: fxFloat 1.1s ease-out; }
  .fx-delta.up { color: #9fffa8; } .fx-delta.down { color: #ffb0a0; }
  @keyframes fxFloat { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-18px); } }
  .btn.ghost { background: rgba(20, 16, 44, 0.8); color: var(--ink); border-color: rgba(160, 170, 255, 0.3); box-shadow: none; }
  .btn.small { display: inline-block; width: auto; padding: 10px 14px; margin: 4px; font-size: 14px; }
  .row2 { display: flex; gap: 8px; width: min(280px, 100%); }
  .classes { width: min(300px, 100%); margin: 0 0 12px; }
  .classes .row { display: flex; gap: 6px; }
  .classes .cls { flex: 1; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(160, 170, 255, 0.25); background: var(--panel); color: var(--ink); font-size: 14px; line-height: 1.3; transition: transform 0.1s; }
  .classes .cls:active { transform: scale(0.96); }
  .classes .cls small { display: block; font-size: 11px; color: var(--dim); }
  .classes .cls.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .classes .cls.on b { color: var(--c); }
  .classes .trait { font-size: 12px; color: var(--dim); margin-top: 6px; text-align: center; }
  .idle-excl { font-size: 12px; color: #ffe27a; margin-top: 4px; text-align: center; }
  .wgroup { font-size: 13px; color: var(--dim); margin: 8px 0 4px; }
  .row2 .btn { flex: 1; margin: 4px 0; }
  .oil { font-size: 14px; color: var(--dim); } .oil b { color: var(--gold); font-size: 18px; margin-left: 4px; }
  /* 子頁面頂列：黏在畫面上方；上緣自己吃掉瀏海／動態島的高度，左右避開橫放時的圓角與鏡頭 */
  .overlay.paged { padding-top: 0; }
  .topbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; width: calc(100% + 32px); margin: 0 -16px 10px; box-sizing: border-box;
    padding: calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    background: linear-gradient(180deg, rgba(9, 7, 24, 0.98) 75%, rgba(9, 7, 24, 0.9)); border-bottom: 1px solid rgba(255, 210, 122, 0.14); }
  .topbar h2 { margin: 0; flex: 1; text-align: left; font-size: 20px; }
  .back { flex: none; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 1px solid var(--edge); background: rgba(24, 18, 50, 0.9);
    display: flex; align-items: center; justify-content: center; }
  .back svg { width: 18px; height: 18px; display: block; }
  .progress { font-size: 12px; color: var(--dim); margin: 2px 0 18px; }

  .chapter { display: block; width: min(340px, 100%); padding: 14px; margin: 0 auto 12px; border-radius: 16px; background: var(--panel); text-align: left;
    border: 1px solid var(--cc, rgba(143, 232, 255, 0.35)); box-shadow: 0 0 22px color-mix(in srgb, var(--cc, #8fe8ff) 20%, transparent); }
  .chapter b { color: var(--cc, #8fe8ff); font-size: 18px; } .chapter div { color: var(--dim); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .chapter .done { float: right; font-size: 12px; color: #ffe27a; border: 1px solid #ffe27a88; border-radius: 8px; padding: 1px 6px; }
  .chapter .best { color: #cfd6ff; }
  /* 聲音設定：一鍵全部靜音＋音樂／音效各 10 格（用按鈕，不用輸入欄位） */
  .sound { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; font-size: 13px; color: var(--dim); }
  .sound .mute { min-width: 96px; } .sound .vol { display: inline-flex; align-items: center; gap: 4px; }
  .sound .vol b { min-width: 16px; color: var(--gold); text-align: center; } .sound .vol button { width: 30px; height: 30px; padding: 0; }
  .sound.off .vol { opacity: 0.45; }
  .stage-note { width: min(340px, 100%); margin: 0 auto 10px; color: var(--dim); font-size: 13px; line-height: 1.5; text-align: left; }
  .aff { display: inline-block; font-style: normal; font-size: 11px; font-weight: 700; color: var(--a); border: 1px solid var(--a); border-radius: 6px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; opacity: 0.75; }
  .aff.on { opacity: 1; background: rgba(255, 255, 255, 0.12); background: color-mix(in srgb, var(--a) 22%, transparent); }
  .aff-line { margin-top: 6px; } .aff-line.on { color: #e9ecff; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(340px, 100%); margin: 0 auto; }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 64px; padding: 6px 2px; border-radius: 12px; background: var(--panel); border: 1px solid var(--edge); color: var(--gold); }
  .stage b { font-size: 20px; } .stage span { font-size: 10px; color: var(--dim); line-height: 1.3; }
  .stage.done { border-color: #ffe27a88; } .stage.done span { color: #ffe27a; } .stage:disabled { opacity: 0.55; }
  .ch1 { --cc: #8fe8ff; } .ch2 { --cc: #9fe6a8; } .ch3 { --cc: #e6a0ff; } .ch4 { --cc: #ffab70; } .ch5 { --cc: #bfe6ff; } .ch6 { --cc: #c6e08a; }

  .list { width: min(380px, 100%); }
  .list .row { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(160, 170, 255, 0.18); text-align: left; }
  .row .info { flex: 1; } .row .lv { color: var(--gold); font-size: 13px; } .row .d { color: #cfd6ff; font-size: 12px; margin-top: 2px; line-height: 1.4; }
  .row .buy { min-width: 64px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--edge); background: #2a1e0c; color: var(--gold); font-weight: 700; line-height: 1.2; }
  .row .max { color: var(--dim); font-size: 13px; }

  .equipped, .bag { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(380px, 100%); }
  .gear { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; border-radius: 12px; background: var(--panel); text-align: left;
    border: 1px solid var(--c, rgba(160, 170, 255, 0.2)); position: relative; font-size: 13px; }
  .gear b { color: var(--c, var(--dim)); } .gear .slot { font-size: 11px; color: var(--dim); } .gear .main { font-size: 12px; color: #cfd6ff; }
  .gear .eq { position: absolute; top: 6px; right: 8px; font-size: 10px; color: #ffe27a; }
  .gear.empty { opacity: 0.55; }
  .summary { width: min(380px, 100%); font-size: 12px; color: #cfd6ff; margin: 10px 0; line-height: 1.5; text-align: left; }
  .bag-title { text-align: left; font-size: 13px; color: var(--dim); margin: 6px 0; flex: 1; }
  .bag-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: min(380px, 100%); margin: 4px 0; }
  .pick-tiers { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
  .chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--c, rgba(160, 170, 255, 0.35)); background: rgba(20, 16, 44, 0.85); color: var(--c, var(--ink)); font-size: 12px; }
  .gear.pick .tick { position: absolute; top: 6px; right: 8px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--c); font-size: 12px; line-height: 18px; text-align: center; color: #0b0a1a; }
  .gear.pick.sel { background: color-mix(in srgb, var(--c) 18%, var(--panel)); } .gear.pick.sel .tick { background: var(--c); }
  .gear.locked { opacity: 0.45; }
  .pending { padding: 10px; border-radius: 14px; border: 1px dashed rgba(255, 200, 90, 0.55); background: rgba(60, 40, 10, 0.25); box-sizing: border-box; }
  .pending:empty { display: none; }
  .pending .bag { width: 100%; margin-top: 8px; } .pending .btn { margin: 8px 0 0; }
  /* 批量分解列：固定在畫面最底（避開 Home 指示條），出現時整頁底部讓出同樣的空間，捲到底時最後一排不會被蓋住；沒勾選任何東西時不出現、不佔位 */
  .batch-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: none; justify-content: center; box-sizing: border-box;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 10px); background: linear-gradient(rgba(5, 4, 13, 0), rgba(5, 4, 13, 0.94) 40%); }
  .batch-bar.show { display: flex; }
  #gear.batching { padding-bottom: calc(env(safe-area-inset-bottom) + 96px); }
  .batch-card { display: flex; align-items: center; gap: 6px; width: min(380px, 100%); box-sizing: border-box; padding: 8px 10px; border-radius: 14px; background: #1b1540; border: 1px solid var(--edge); font-size: 13px; text-align: left; }
  .batch-card span { flex: 1; } .batch-card b { color: var(--gold); } .batch-card .btn { margin: 0; }
  .sheet-p { font-size: 13px; color: #cfd6ff; line-height: 1.55; margin: 6px 0; } .sheet-p.warn, .warn { color: #ffb38a !important; font-weight: 700; }
  .opts { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
  .opt { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(160, 170, 255, 0.25); background: var(--panel); text-align: left; font-size: 14px; }
  .opt.on { border-color: var(--gold); color: var(--gold); } .opt span { font-size: 11px; color: var(--gold); }
  /* 進階（突破／專屬武器星級）：全部能力列出，已解鎖亮、未解鎖暗 */
  .stars { color: #ffd27a; letter-spacing: 1px; font-size: 11px; margin-left: 4px; }
  .ascend { position: relative; margin: 8px 0; padding: 8px 10px; border-radius: 12px; background: rgba(255, 210, 122, 0.07); border: 1px solid rgba(255, 210, 122, 0.25); }
  .asc-title { font-weight: 800; color: var(--gold); font-size: 14px; }
  .perks { list-style: none; padding: 0 !important; margin: 6px 0 !important; font-size: 13px !important; line-height: 1.6 !important; }
  .perks li.on { color: #ffe9a8; } .perks li.off { color: var(--dim); opacity: 0.8; }
  .asc-sub { display: block; font-size: 11px; color: var(--dim); font-weight: 400; margin-top: 2px; }
  .stat-block { margin: 6px 0 8px; padding: 8px 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); }
  .stat-block.on { background: rgba(120, 230, 160, 0.08); border-color: rgba(120, 230, 160, 0.45); }
  .stat-block .sb-title { font-size: 12px; font-weight: 700; color: var(--dim); margin-bottom: 2px; } .stat-block.on .sb-title { color: #8cf0b0; }
  .stat-lines { list-style: none; padding: 0 !important; margin: 0 !important; font-size: 14px; line-height: 1.7; }
  .stat-lines .tag { float: right; font-size: 11px; color: var(--dim); } .stat-block.on .stat-lines li { color: #eafff0; } .stat-block.on .stat-lines li.mainline { color: #ffe9a8; font-weight: 700; }
  .stat-block.idle .stat-lines li { color: #cfd6ff; }
  .asc-need { font-size: 12px; color: #cfd6ff; margin: 4px 0; } .asc-hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .wbtns { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .wslot .ghostbuy { background: rgba(20, 16, 44, 0.8); color: var(--ink); border-color: rgba(160, 170, 255, 0.3); font-size: 12px; }
  .empty-bag { grid-column: 1 / -1; color: var(--dim); font-size: 13px; padding: 12px; }
  .sheet { position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.5); z-index: 5; }
  .sheet.show { display: flex; }
  .sheet-card { width: min(420px, 100%); max-height: 88vh; max-height: calc(100dvh - 24px); overflow-y: auto; touch-action: pan-y; box-sizing: border-box; padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); border-radius: 18px 18px 0 0;
    background: #141032; border-top: 2px solid var(--c); text-align: left; }
  .sheet-card .name { color: var(--c); font-size: 18px; } .sheet-card .rar { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .sheet-card ul { margin: 0 0 10px; padding-left: 18px; font-size: 14px; line-height: 1.7; } .sheet-card .mainline { color: #ffe9a8; font-weight: 700; }
  .sheet-card .acts { text-align: center; }

  .cards { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
  .card { display: flex; gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; background: var(--panel);
    border: 1px solid var(--c, var(--edge)); box-shadow: 0 0 16px color-mix(in srgb, var(--c, #ffd27a) 30%, transparent); }
  .card:active { transform: scale(0.98); }
  .card img { width: 52px; height: 52px; flex: none; }
  .card .t { font-weight: 800; font-size: 16px; } .card .l { font-size: 12px; font-weight: 700; color: var(--c); margin-left: 6px; }
  .card .d { font-size: 13px; color: #cfd6ff; margin-top: 3px; line-height: 1.4; } .card .h { font-size: 11px; color: #ffcf8a; margin-top: 4px; }
  /* 身上已有可共鳴的對象：卡片外框改成金色、右上角標「可共鳴」 */
  .card.reso-ready { border-color: #ffd27a; box-shadow: 0 0 18px rgba(255, 210, 122, 0.45); }
  .card.reso-ready .h { color: #ffe9a8; font-weight: 700; }
  .card .h.bond { color: #ffd98a; }
  .card .rb { margin-left: 6px; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 800; color: #1a1206; background: #ffd27a; vertical-align: 2px; }
  .build { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 4px 0 16px; max-width: 320px; }
  .build span { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--dim); width: 60px; }
  .build img { width: 40px; height: 40px; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 18px; margin: 6px 0 14px; font-size: 15px; }
  .stats dt { color: var(--dim); text-align: right; } .stats dd { margin: 0; text-align: left; font-weight: 700; }
  .ledger { width: min(300px, 100%); margin: 0 0 12px; font-size: 14px; }
  .ledger div { display: flex; justify-content: space-between; padding: 3px 0; color: #cfd6ff; } .ledger b { color: var(--gold); }
  .ledger .total { border-top: 1px solid var(--edge); margin-top: 4px; padding-top: 6px; font-size: 16px; }
  .ledger .note { font-size: 12px; color: var(--dim); }
  .drops { width: min(300px, 100%); margin-bottom: 10px; } .drops-title { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  .drop { display: flex; justify-content: space-between; padding: 6px 10px; margin-bottom: 4px; border-radius: 10px; background: var(--panel); border: 1px solid var(--c); font-size: 13px; }
  .drop b { color: var(--c); }
  .win h1 { font-size: 36px; } .lose h1 { font-size: 36px; color: #c9b8ff; text-shadow: 0 0 18px rgba(150, 120, 255, 0.7); }
  .hint { font-size: 12px; color: var(--dim); margin-top: 14px; line-height: 1.6; }
  .linkish { background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; margin-top: 10px; }
  .row2 .btn { position: relative; }
  .shop-dot { display: none; position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff7a8a; box-shadow: 0 0 8px #ff7a8a; }
  .wallet { display: flex; gap: 12px; justify-content: center; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .wallet b { color: var(--gold); font-size: 15px; margin-left: 3px; }
  .shop-foot { width: min(380px, 100%); font-size: 11px; color: var(--dim); opacity: 0.8; margin: 6px 0 4px; line-height: 1.5; }
  .space { font-size: 12px; color: #cfd6ff; margin: 8px 0 2px; line-height: 1.5; } .space.warn { color: #ffcf8a; }
  .shop-sec { width: min(380px, 100%); margin-bottom: 12px; text-align: left; }
  .sec-title { font-size: 15px; font-weight: 800; color: var(--gold); margin: 4px 0 6px; }
  .shop-row { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--panel); border: 1px solid rgba(160, 170, 255, 0.18); }
  .shop-row > div { flex: 1; } .shop-row .d, .shop-sec .d { color: #cfd6ff; font-size: 12px; margin-top: 2px; line-height: 1.45; }
  .shop-sec .small { font-size: 11px; color: var(--dim); margin: 4px 0 8px; }
  .shop-row .buy { min-width: 76px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--edge); background: #2a1e0c; color: var(--gold); font-weight: 700; line-height: 1.2; }

<script>
"use strict";
// ---- stick.js
const __m_stick_js = (() => {
// 浮動搖桿的純邏輯（不碰 DOM），input.js 用它，tools/input-latency.mjs 用同一份模擬手指軌跡量反應時間。
// cfg：
//   dead   死區（CSS px）：手指移動小於這個距離不動
//   full   拖多遠才全速（CSS px）：dead～full 之間速度線性增加
//   ring   搖桿外圈半徑（CSS px）：畫面上畫的圈
//   follow 手指拖出外圈時，原點跟著手指走（永遠保持在 ring 以內），反向時不必先把手指拖回原點
//   rampFrom 速度從哪個距離開始算起（預設＝dead；M1～M3 的舊版是從 0 算，所以一過死區就有 dead/full 的速度）
const STICK_LEGACY = { dead: 6, full: 56, ring: 56, follow: false, rampFrom: 0 }; // M1～M3 的設定（量測對照用）

function stickDown(s, id, x, y) { s.active = true; s.id = id; s.ox = x; s.oy = y; s.x = x; s.y = y; }
function stickMove(s, id, x, y, cfg) {
  if (!s.active || s.id !== id) return;
  s.x = x; s.y = y;
  if (cfg.follow) {
    const dx = x - s.ox, dy = y - s.oy, d = Math.hypot(dx, dy);
    if (d > cfg.ring) { s.ox = x - dx / d * cfg.ring; s.oy = y - dy / d * cfg.ring; }
  }
}
function stickUp(s, id) { if (s.id === id) { s.active = false; s.id = null; } }
// 回傳移動向量（長度 0～1）
function stickVector(s, cfg) {
  if (!s.active) return { x: 0, y: 0 };
  const dx = s.x - s.ox, dy = s.y - s.oy, d = Math.hypot(dx, dy);
  if (d <= cfg.dead) return { x: 0, y: 0 };
  const from = cfg.rampFrom ?? cfg.dead;
  const k = Math.min(1, (d - from) / Math.max(1e-6, cfg.full - from)) / d;
  return { x: dx * k, y: dy * k };
}

return { STICK_LEGACY, stickDown, stickMove, stickUp, stickVector };
})();

// ---- input.js
const __m_input_js = (() => {
// 輸入：浮動虛擬搖桿（觸控/滑鼠按住拖曳）＋鍵盤。輸出統一為 move 向量（長度 0~1）。

const { stickDown, stickMove, stickUp, stickVector } = __m_stick_js;
// M4 起：拖 22px 就全速；原點跟隨手指、保持在 30px 內（反向時手指只要往回拉一小段）。量測見 tools/input-latency.mjs
const STICK = { dead: 6, full: 22, ring: 30, follow: true };

function createInput(el) {
  const keys = new Set();
  const stick = { active: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };

  el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); stickDown(stick, e.pointerId, e.clientX, e.clientY); e.preventDefault(); });
  el.addEventListener('pointermove', (e) => stickMove(stick, e.pointerId, e.clientX, e.clientY, STICK));
  el.addEventListener('pointerup', (e) => stickUp(stick, e.pointerId));
  el.addEventListener('pointercancel', (e) => stickUp(stick, e.pointerId));
  addEventListener('keydown', (e) => keys.add(e.code));
  addEventListener('keyup', (e) => keys.delete(e.code));
  addEventListener('blur', () => { keys.clear(); stick.active = false; });

  return {
    stick, RADIUS: STICK.ring,
    reset() { keys.clear(); stick.active = false; stick.id = null; },
    get move() {
      let x = 0, y = 0;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) x -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) x += 1;
      if (keys.has('KeyW') || keys.has('ArrowUp')) y -= 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) y += 1;
      const v = stickVector(stick, STICK);
      x += v.x; y += v.y;
      const len = Math.hypot(x, y);
      return len > 1 ? { x: x / len, y: y / len } : { x, y };
    },
  };
}

return { STICK, createInput };
})();

// 新怪物（M8 第五輪第四批，擁有者選「甲」：不加生態系，在既有 6 個生態系的第 4～10 關加入）：from＝從第幾關開始、at＝這一局第幾秒開始出現、w＝名單權重；
// ring＝另外加一次成群事件。每一關比前一關多一種或一樣多（meta-test 檢查只增不減）；第 7～10 關四種都有。
const NEW_FOES = [
  { kind: 'circler', from: 4, at: 60,  w: 2,   ring: { at: 200, n: 10 } },
  { kind: 'mender',  from: 5, at: 90,  w: 1.2 },
  { kind: 'vine',    from: 6, at: 75,  w: 1.2 },
  { kind: 'aegis',   from: 7, at: 100, w: 1.5 },
];
// 各生態系的招牌怪（sig 放大它們在名單與成群事件裡的份量）；螢苔原的招牌是精英，所以它的 sig 換成多一隻精英
const SIGNATURE = { 1: [], 2: ['bloater'], 3: ['blinker'], 4: ['cinder', 'golem'], 5: ['frostmoth', 'glider'], 6: ['rooter', 'hive'] };
// 多出來的精英：在菌潮最後幾波附近出現（組建已成形、燈核用得到）；種類用本章最後一隻精英
const EXTRA_ELITE_AT = [335, 385, 250]; // 最多 3 隻（螢苔原的招牌是精英，第 7 關起會用到第 3 個時間點）
// 某生態系的第 n 關：回傳一份 chapter（sim、meta、render 都照原本的方式使用它）
function stageChapter(ch, n) {
  const L = STAGE_LEVERS[n - 1], oil = STAGES.oil ** (n - STAGES.base), sigKinds = SIGNATURE[ch.id] ?? [], r = ch.reward;
  const lastElite = [...ch.events].reverse().find((e) => e.type === 'elite')?.kind;
  const extra = (L.elites + (ch.id === 1 && L.sig >= 2 ? 1 : 0));
  const foes = NEW_FOES.filter((f) => n >= f.from);
  // 新怪不稀釋招牌（監督者批准，M8 第五輪第四批）：新怪加進名單時，招牌怪的權重放大 k 倍，讓招牌怪在名單裡的份量和沒有新怪時一樣——
  // 新怪只分走一般怪的份量。S＝招牌、O＝其他原本的怪、F＝新怪：kS/(kS+O+F) ＝ S/(S+O) → k ＝ 1 + F/O。
  // 理由：沒做這條時，盾殼從第 7 關加入名單剛好抵消了第 6→7 關「招牌變強」的增量（份量 47→47%），霧沼的脹孢囊少約 27%、晶窟少約 14%——
  // 下限是防崩潰用的，不是用來慢慢侵蝕的；而「剛好抵消」不會觸發任何警報。
  const sigW = ch.roster.reduce((a, [, kind, w]) => a + (sigKinds.includes(kind) ? w * L.sig : 0), 0), otherW = ch.roster.reduce((a, [, kind, w]) => a + (sigKinds.includes(kind) ? 0 : w), 0);
  const sigK = sigW > 0 && otherW > 0 ? 1 + foes.reduce((a, f) => a + f.w, 0) / otherW : 1;
  const events = [
    ...foes.filter((f) => f.ring).map((f) => ({ at: f.ring.at, type: 'ring', kind: f.kind, n: f.ring.n })),
    ...ch.events.map((e) => ((e.type === 'ring' || e.type === 'rush') && sigKinds.includes(e.kind) ? { ...e, n: Math.round(e.n * L.sig) } : e)),
    ...EXTRA_ELITE_AT.slice(0, extra).map((at) => ({ at, type: 'elite', kind: lastElite })),
  ].sort((a, b) => a.at - b.at);
  return {
    ...ch, stage: n, key: `${ch.id}-${n}`, levers: L, bossHpMul: L.hp, speedMul: L.speed, cdMul: L.cd,
    hpScale: (t) => ch.hpScale(t) * L.hp, dmgScale: (t) => ch.dmgScale(t) * L.dmg, spawnRate: (t) => ch.spawnRate(t) * L.spawn,
    roster: [...ch.roster.map(([at, kind, w]) => [at, kind, sigKinds.includes(kind) ? w * L.sig * sigK : w]), ...foes.map((f) => [f.at, f.kind, f.w])],
    events,
    ...(ch.roots ? { roots: { ...ch.roots, every: ch.roots.every / Math.sqrt(L.sig) } } : {}),
    reward: { ...r, clear: Math.round(r.clear * oil), firstClear: Math.round(r.firstClear * oil),
      firstStardust: n === STAGES.base ? r.firstStardust : STAGES.deepFirstStardust },
  };
}

  function rosterPick() {

    else if (ev.type === 'rush') {
      const a = rand() * TAU, d = spawnDist(), cx = p.x + Math.cos(a) * d, cy = p.y + Math.sin(a) * d;
      for (let i = 0; i < ev.n; i++) { const off = (i / (ev.n - 1) - 0.5) * 360; spawnEnemy(ev.kind, { x: cx - Math.sin(a) * off, y: cy + Math.cos(a) * off }); }
    } else if (ev.type === 'elite') {
      const affix = pick(Object.keys(ELITE_AFFIXES));
      spawnEnemy(ev.kind, { elite: true, affix, dist: ENEMIES[ev.kind].ai === 'turret' ? 200 : undefined, force: true });
      s.events.push({ type: 'announce', text: `精英出現：${ELITE_AFFIXES[affix].name}${ENEMIES[ev.kind].name}` });
    } else if (ev.type === 'boss') startBoss(ev.kind);
    s.events.push({ type: 'wave', kind: ev.type });
  }
  // 菌潮：時間到就排好這一波的幾個批次，批次到了從四周一圈湧入；場上怪物到 SURGE.cap 就不再生（這批剩下的不補）
  function updateSurge() {
    const sg = s.surge, next = SURGE.first + sg.idx * SURGE.every;
    if (!s.boss && s.t >= next && next <= s.chapter.bossAt - SURGE.beforeBoss) {
      const n = SURGE.base + SURGE.grow * sg.idx, per = Math.ceil(n / SURGE.bursts);
      for (let b = 0; b < SURGE.bursts; b++) sg.queue.push([s.t + b * SURGE.burstGap, Math.min(per, n - b * per)]);
      sg.idx++;
      s.events.push({ type: 'announce', text: `菌潮來襲！（第 ${sg.idx} 波）` }, { type: 'surge', n });
    }
    while (sg.queue.length && s.t >= sg.queue[0][0]) {
      const [, cnt] = sg.queue.shift(), off = rand() * TAU;
      for (let i = 0; i < cnt && s.surgeAlive < SURGE.cap && s.enemies.length < SURGE.total - SURGE.reserve && !s.boss; i++) { const m = spawnEnemy(SURGE.kind, { angle: off + (i / cnt) * TAU, dist: spawnDist() + (i % 3) * 22 }); if (m) { m.surge = true; s.surgeAlive++; } }

  }
  function startBoss(kind) {
    s.arena = { x: p.x, y: p.y, r: s.chapter.arenaR };
    // 光圈外的怪直接消散（不給經驗、不算擊倒）
    s.enemies = s.enemies.filter((e) => {
      const inside = Math.hypot(e.x - s.arena.x, e.y - s.arena.y) < s.arena.r - 10;
      if (!inside) s.events.push({ type: 'fade', x: e.x, y: e.y });
      return inside;
    });
    s.ebullets.length = 0; s.hazards.length = 0; s.roots.length = 0; s.rootT = 3; s.mines = s.mines.filter((m) => Math.hypot(m.x - s.arena.x, m.y - s.arena.y) < s.arena.r);
    s.boss = spawnEnemy(kind, { x: p.x, y: p.y - s.arena.r * 0.7, force: true });
    s.events.push({ type: 'announce', text: `燈塔守衛：${ENEMIES[kind].name}`, big: true });
  }

  // ---------- 空間雜湊 ----------
  const CELL = 48;
  let grid = new Map();
  const key = (cx, cy) => cx * 73856093 ^ cy * 19349663;
  function buildGrid() {
    grid = new Map();
    for (const e of s.enemies) {
      const k = key(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
      let b = grid.get(k); if (!b) grid.set(k, b = []); b.push(e);
    }
  }
  function near(x, y, fn, rad = 1) {
    const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
    for (let i = -rad; i <= rad; i++) for (let j = -rad; j <= rad; j++) { const b = grid.get(key(cx + i, cy + j)); if (b) for (const e of b) fn(e); }
  }
  function nearest(x, y, maxD, skip) {
    let best = null, bd = maxD * maxD;
    for (const e of s.enemies) {
      if (e.hp <= 0 || (skip && skip.has(e))) continue;
      const d2 = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d2 < bd) { bd = d2; best = e; }
    }
    return best;
  }

  // ---------- 地形互動 ----------
  const terrain = s.chapter.terrain;
  function pillarAt(x, y) { // 子彈只需查自己所在格（晶柱完整落在格內）
    if (terrain !== 'pillars') return null;
    const T = TERRAIN.pillars, f = terrainCell('pillars', s.terrainSeed, Math.floor(x / T.cell), Math.floor(y / T.cell));
    return f && (x - f.x) ** 2 + (y - f.y) ** 2 < f.r * f.r ? f : null;
  }
  function pushOutOfPillars(o, rad) {
    if (terrain !== 'pillars') return;
    for (const f of terrainIn('pillars', s.terrainSeed, o.x - rad, o.y - rad, o.x + rad, o.y + rad)) {
      const dx = o.x - f.x, dy = o.y - f.y, d = Math.hypot(dx, dy) || 0.01, min = f.r + rad;
      if (d < min) { o.x = f.x + dx / d * min; o.y = f.y + dy / d * min; }
    }
  }
  const count = (k, n = 1) => { s.counters[k] = (s.counters[k] || 0) + n; };
  function cellFeature(kind, x, y) { // 查自己所在格的地形（地形完整落在格內）
    if (terrain !== kind) return null;
    const T = TERRAIN[kind], f = terrainCell(kind, s.terrainSeed, Math.floor(x / T.cell), Math.floor(y / T.cell));
    return f && (x - f.x) ** 2 + (y - f.y) ** 2 < f.r * f.r ? f : null;
  }
  // 熔坑噴發：玩家受固定傷害；怪每秒受 enemyDps（可以把怪引進熔坑）
  function updateVents(dt) {
    if (terrain !== 'vents') return;
    const T = TERRAIN.vents, fp = cellFeature('vents', p.x, p.y);
    if (fp && ventState(fp, s.terrainSeed, s.t)?.fire) { const before = p.hp; hurtPlayer(T.dmg, 'vent'); if (p.hp < before) count('ventHitsPlayer'); }
    for (const e of s.enemies) {
      if (e.hp <= 0 || isBoss(e.kind)) continue;
      const f = cellFeature('vents', e.x, e.y);
      if (!f || !ventState(f, s.terrainSeed, s.t)?.fire) continue;
      const burn = `${f.ix},${f.iy},${Math.floor(s.t / T.period)}`; // 同一次噴發只算一次「燒到一隻怪」
      if (e.ventBurn !== burn) { e.ventBurn = burn; count('ventBurnsEnemy'); }
      e.hp -= T.enemyDps * dt; e.flash = 0.06;
    }
  }
  // 菌根牆（第六章）：兩道根牆從玩家兩側往中間推進、互相穿過後消失；碰到會被推著走並被刺傷。怪不受影響（菌群本來就從根裡長出來）。
  function spawnRootPair(cx, cy, dist, R) {
    const a = rand() * TAU;
    for (const sgn of [1, -1]) {
      const nx = -Math.cos(a) * sgn, ny = -Math.sin(a) * sgn; // 往中心移動的方向
      s.roots.push({ x: cx - nx * dist, y: cy - ny * dist, nx, ny, len: R.len, w: R.w, speed: R.speed, left: dist * 2 + 60, dmg: R.dmg, near: false });
    }
    s.events.push({ type: 'roots', x: cx, y: cy });
  }
  function updateRoots(dt) {
    const R = s.chapter.roots;
    if (!R) return;
    if (!s.boss) { s.rootT -= dt; if (s.rootT <= 0 && s.t > R.first) { s.rootT = R.every; spawnRootPair(p.x, p.y, R.dist, R); } }
    for (const r of s.roots) {
      const step = r.speed * dt; r.x += r.nx * step; r.y += r.ny * step; r.left -= step;
      const tx = -r.ny, ty = r.nx, rx = p.x - r.x, ry = p.y - r.y, along = rx * tx + ry * ty, perp = rx * r.nx + ry * r.ny;
      // 招牌計數（M8 第五輪第四批）：牆推進到角色前方 200px 內時，角色還在它的路徑上（牆的長度範圍內）＝這道牆逼近了角色，每道牆算一次。
      // 200 大於自動玩家開始躲牆的 180：這個數不會因為量尺會不會躲牆而改變。舊的計數「根牆刺傷」量的是玩家沒躲開幾次（量尺看得到牆時少 80～86%）
      if (!r.near && perp > 0 && perp < 200 && Math.abs(along) < r.len / 2) { r.near = true; count('rootNears'); }
      if (Math.abs(along) < r.len / 2 && Math.abs(perp) < r.w / 2 + 12) { // 被根牆推著走（推到牆的前方）
        const push = r.w / 2 + 12 - perp; p.x += r.nx * push; p.y += r.ny * push; count('rootPushFrames');
        const before = p.hp; hurtPlayer(r.dmg, 'root'); if (p.hp < before) count('rootHits');
      }
    }
    s.roots = s.roots.filter((r) => r.left > 0);
  }
  function inPool(x, y) {
    if (terrain !== 'pools') return false;
    const R = TERRAIN.pools.rMax; // 泥沼完整落在自己的格內，查 ±rMax 的範圍就夠
    return terrainIn('pools', s.terrainSeed, x - R, y - R, x + R, y + R).some((f) => (x - f.x) ** 2 + (y - f.y) ** 2 < f.r * f.r);
  }

  // ---------- 傷害 ----------
  // 這一下傷害是哪一把武器打的（音效依武器種類換音色用）：武器迴圈、子彈、落星、燈籠雷、燃燒各自在呼叫 damage 前設好
  let dmgSrc = null;
  function damage(e, amount, kx = 0, ky = 0) {
    if (e.hp <= 0) return;
    const aff = e.affix && ELITE_AFFIXES[e.affix];
    let crit = false;
    const fg = ENEMIES[e.kind].farGuard; // 遠處打來：外殼硬化＋衝過來（脹孢囊）
    // 只有「被射中」才算（投射物、光束、狙擊）；範圍攻擊、場、灼燒不算——落星砸到遠處的怪不是在遠處瞄準它（燈術師量過會被這條規則誤傷）
    if (fg && !AREA.has(dmgSrc) && dmgSrc !== 'burn' && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 > fg.dist * fg.dist) { amount *= fg.dmgTaken; if (!(e.rushT > 0)) count('farGuards'); e.rushT = fg.t; }
    const fb = ENEMIES[e.kind].farBreak; // 遠處射中：外殼裂開、護甲暫時失效（根鬚兵）——同樣只算「被射中」
    if (fb && !AREA.has(dmgSrc) && dmgSrc !== 'burn' && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 > fb.dist * fb.dist) { if (!(e.breakT > 0)) count('rootBreaks'); e.breakT = fb.t; }
    let blocked = false;
    // 盾殼：正面擋下射擊與刀光；範圍攻擊與灼燒不擋。「從哪個方向打來」用這一下實際的方向（子彈、迴光刃、劍氣、螢蜂、光球會傳 kx/ky＝把怪推開的方向），
    // 沒傳方向的才當成從角色那邊打來——第一版一律用角色的位置，迴光刃從背後飛回來、折光彈反彈、光球繞到背面也照擋，「繞到側後就打得到」只對角色本人成立
    //（職業差距第 7 關：刃舞者在晶窟晚 2 階，把擋傷關掉後 mid 7/12 → 9/12）
    const sh = ENEMIES[e.kind].shield;
    if (sh && !AREA.has(dmgSrc) && dmgSrc !== 'burn') {
      const ax = kx || ky ? -kx : p.x - e.x, ay = kx || ky ? -ky : p.y - e.y, al = Math.hypot(ax, ay) || 1;
      if ((ax * Math.cos(e.face) + ay * Math.sin(e.face)) / al > Math.cos(sh.arc)) { amount *= sh.taken; blocked = true; count('shieldBlocks'); }
    }
    if (forceCrit) { amount *= forceCrit; crit = true; }
    else if (TR.crit && rand() < TR.crit) { amount *= TR.critMul; crit = true; } // 燈銃手：天生暴擊
    if (TR.heavyMul && (e.elite || isBoss(e.kind))) amount *= TR.heavyMul; // 刃舞者：推不動的目標砍得更重
    if (e.markT > 0 && bond('mark')) amount *= BFX('mark').mul; // 標定：被標記的怪受到的所有傷害加重
    if (e.shockT > 0 && dmgSrc !== 'chain') { amount *= FX('conduct').mul; e.shockT = 0; count('conducted'); } // 導電：被雷打過的怪，下一次受傷加重
    const dmg = Math.max(1, Math.round(amount * p.dmgMul * affinityMul(s.affinity && s.affinityOn, AFFINITY.dmgMul) * (aff?.dmgTaken ?? 1) * (e.breakT > 0 ? 1 : ENEMIES[e.kind].armor ?? 1)));
    e.hp -= dmg; e.flash = 0.08;
    if (!isBoss(e.kind)) {
      const near = TR.nearR && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < TR.nearR * TR.nearR; // 刃舞者：身邊的命中擊退加倍
      const k = 6 / e.mass * (near ? TR.nearKnock : 1);

    }
    if (TR.areaBurn && AREA.has(dmgSrc)) ignite(e, amount * TR.areaBurn, TR.burnT); // 燈術師：範圍攻擊附帶灼燒
    if (crit) count('crits');
    s.events.push({ type: 'hit', x: e.x, y: e.y - e.r, v: dmg, big: dmg >= 30 || crit, crit, src: dmgSrc, elite: !!e.elite, boss: isBoss(e.kind), blocked });
  }
  let forceCrit = 0; // 靜息準星：這一槍必定暴擊（倍率）
  function ignite(e, dps, dur) { if (dps > (e.burnDps || 0) || (e.burnT || 0) < dur) { e.burnDps = Math.max(dps, e.burnT > 0 ? e.burnDps : 0); e.burnT = dur; } }
  function hurtPlayer(raw, src) {
    if (p.hurtT > 0 || s.god || s.phase !== 'play') return;
    const dmg = Math.max(1, Math.round(raw * p.armorMul));
    p.hp -= dmg; p.hurtT = 0.5;
    s.events.push({ type: 'hurt', x: p.x, y: p.y, v: dmg, src });
    if (p.hp > 0) return;
    if (p.revives > 0) { // 復燃：半血復活，短暫無敵並震開周圍
      p.revives--; p.hp = p.maxHp * 0.5; p.hurtT = 2;
      s.ebullets.length = 0;

      s.events.push({ type: 'revive', x: p.x, y: p.y });

    }
    p.hp = 0; s.phase = 'lose'; s.events.push({ type: 'lose' });
  }

  // ---------- 武器 ----------
  function fireBolt(w, st, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const target = nearest(p.x, p.y, aimRange);
    if (!target) return;
    w.cd = st.cd * p.cdMul;
    const base = Math.atan2(target.y - p.y, target.x - p.x);
    for (let i = 0; i < st.shots; i++) {
      const a = base + (i - (st.shots - 1) / 2) * 0.14;
      s.bullets.push({ x: p.x, y: p.y, vx: Math.cos(a) * st.speed, vy: Math.sin(a) * st.speed, life: 1.1, dmg: st.dmg, pierce: st.pierce, hit: new Set(), shard: st.shard || 0, big: w.id === 'bolt' && !!w.evo, evo: !!w.evo, src: w.id, burn: st.burn, burnT: st.burnT, ...(bond('crossfire') ? { edge: true, bounce: BFX('crossfire').bounces } : {}) }); // 交錯火網
    }
  }
  function orbitWeapon(w, st, dt) {
    if (w.bellT > 0) w.bellT -= dt;
    w.ang += st.spin * dt;
    w.orbs = [];
    for (let i = 0; i < st.count; i++) {
      const a = w.ang + (i / st.count) * TAU;
      const rad = st.radius * (w.bellT > 0 ? BFX('bellring').mul : 1); // 鐘環：燈鐘敲響後光球向外擴張
      const ox = p.x + Math.cos(a) * rad, oy = p.y + Math.sin(a) * rad;
      w.orbs.push({ x: ox, y: oy, a });
      if (has('ward')) for (const b of s.ebullets) if (b.life > 0 && (b.x - ox) ** 2 + (b.y - oy) ** 2 < (st.size + FX('ward').pad + b.r) ** 2) { b.life = 0; count('blocked'); } // 護身環：擋子彈
      near(ox, oy, (e) => {
        if (e.orbT > 0 || e.hp <= 0) return;
        if ((e.x - ox) ** 2 + (e.y - oy) ** 2 < (e.r + st.size) ** 2) { e.orbT = 0.4; damage(e, st.dmg, Math.cos(a), Math.sin(a)); }
      });
    }

      w.fling -= dt;

        s.bullets.push({ x: o.x, y: o.y, vx: Math.cos(o.a) * 300, vy: Math.sin(o.a) * 300, life: 1.2, dmg: st.dmg * 0.6, pierce: 3, hit: new Set(), shard: 0, star: true, src: 'orbit' });
      }
    }
  }
  function auraWeapon(w, st, dt) {
    w.cd -= dt;
    const onTrail = bond('warmpath') && s.patches.some((q) => q.src === 'trail' && (q.x - p.x) ** 2 + (q.y - p.y) ** 2 < q.r * q.r); // 暖徑
    const R = st.radius * (onTrail ? BFX('warmpath').mul : 1);

    w.cd = st.tick * p.cdMul;

      }
    }, Math.ceil(R / CELL) + 1);
    if (n && has('ember')) { const f = FX('ember'), h = Math.min(f.cap, n * f.per); p.hp = Math.min(p.maxHp, p.hp + h); count('auraHeal', h); } // 暖芯：燒到越多回越多
    s.events.push({ type: 'aura', x: p.x, y: p.y, r: R, evo: !!w.evo, warm: onTrail });
  }
  function chainWeapon(w, st, dt) {
    w.cd -= dt;

    if (!first) return;
    w.cd = st.cd * p.cdMul;
    const hit = new Set();
    for (let k = 0; k < st.arcs; k++) {
      let cur = k === 0 ? first : nearest(p.x, p.y, reach, hit);

      const pts = [[p.x, p.y]];
      for (let j = 0; j <= st.jumps && cur; j++) {
        hit.add(cur); pts.push([cur.x, cur.y]);
        const burning = cur.burnT > 0;
        damage(cur, st.dmg);
        if (burning && bond('thunderfire')) { // 雷火：電弧打中燃燒中的怪，引爆一圈火焰
          const f = BFX('thunderfire'), cx = cur.x, cy = cur.y; dmgSrc = 'thunderfire';
          near(cx, cy, (o) => { if (o !== cur && o.hp > 0 && (o.x - cx) ** 2 + (o.y - cy) ** 2 < (f.r + o.r) ** 2) damage(o, st.dmg * f.dmgK, 0, 0); }, Math.ceil(f.r / CELL) + 1);
          dmgSrc = w.id; s.events.push({ type: 'bondBurst', x: cx, y: cy, r: f.r, bond: 'thunderfire' });
        }

  }
  // 迴光刃：朝最近的敵人擲出，飛到 range 後折返回到玩家；折返時清空已命中名單，所以來回都能打到
  function boomerangWeapon(w, st, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const target = nearest(p.x, p.y, aimRange);
    if (!target) return;
    w.cd = st.cd * p.cdMul;
    const base = Math.atan2(target.y - p.y, target.x - p.x);
    for (let i = 0; i < st.count; i++) {
      const a = base + (i - (st.count - 1) / 2) * 0.45;
      s.bullets.push({ boom: true, out: true, x: p.x, y: p.y, dx: Math.cos(a), dy: Math.sin(a), vx: Math.cos(a) * st.speed, vy: Math.sin(a) * st.speed, speed: st.speed, range: st.range, traveled: 0, life: 6, dmg: st.dmg, pierce: 1e9, hit: new Set(), size: st.size, src: w.id, evo: !!w.evo });
    }
  }
  // 落星：挑怪最密集的點（在附近隨機取樣幾隻，數各自周圍的怪），延遲 delay 秒後範圍爆炸
  function mortarWeapon(w, st, dt) {
    w.cd -= dt;
    if (w.cd > 0) return;
    const cands = s.enemies.filter((e) => (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < 320 * 320);
    if (!cands.length) return;
    w.cd = st.cd * p.cdMul;

  // ---------- 地面危險（預警 arm 秒後生效 dur 秒） ----------

  // ---------- 主更新 ----------

      const a = Math.random() * Math.PI * 2, v = spd * (0.3 + Math.random());
      fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.6), img, size });
    }
  }
  function banner(text, big) { fx.banners.push({ text, big, life: big ? 3 : 2.2, max: big ? 3 : 2.2 }); }

  function consume(s, dt) {
    for (const e of s.events) {
      switch (e.type) {
        case 'hit': fx.texts.push({ x: e.x + (Math.random() - 0.5) * 8, y: e.y, v: e.v, big: e.big, life: 0.6 }); burst(e.x, e.y + 4, 2, G.bolt, 70, 0.3, 8); break;
        case 'kill': burst(e.x, e.y, e.elite ? 30 : 9, e.elite ? G.gold : G.spark, e.elite ? 220 : 130); break;
        case 'fade': burst(e.x, e.y, 5, G.spark, 60); break;
        case 'hurt': fx.shake = 7; fx.hurtFlash = 0.35; burst(e.x, e.y, 10, G.spark, 160); break;
        case 'level': fx.levelFlash = 1; burst(e.x, e.y, 30, G.gem, 220); break;
        case 'arc': fx.arcs.push({ pts: e.pts, life: 0.18, evo: e.evo }); break;
        case 'aura': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.3, color: e.evo ? 'sun' : undefined }); break;
        case 'lance': fx.lances.push({ x: e.x, y: e.y, ang: e.ang, len: e.len, w: e.w, evo: e.evo, life: 0.22 }); break;
        case 'snipe': fx.snipes.push({ x: e.x, y: e.y, tx: e.tx, ty: e.ty, r: e.r, evo: e.evo, life: 0.25 }); burst(e.tx, e.ty, e.evo ? 8 : 5, e.evo ? G.evo : G.lanceG, 160, 0.3, 9); break;
        case 'vortexBurst': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: e.evo ? 'gold' : 'void' }); burst(e.x, e.y, e.evo ? 18 : 12, e.evo ? G.evo : G.void, 220, 0.45, 11); fx.shake = Math.max(fx.shake, 3); break;
        case 'ashBurst': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: 'blast' }); burst(e.x, e.y, 14, G.ember, 200, 0.45, 11); fx.shake = Math.max(fx.shake, 3); break;
        case 'bondBurst': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: 'blast' }); burst(e.x, e.y, 12, G.ember, 200, 0.4, 11); break;
        case 'bounce': burst(e.x, e.y, 3, e.evo ? G.evo : G.rico, 90, 0.25, 8); break;
        case 'pulse': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: e.evo ? 'pulseEvo' : 'pulse' }); if (e.evo) { fx.rings.push({ x: e.x, y: e.y, r: e.r * 0.7, life: 0.35, color: 'pulseEvo' }); burst(e.x, e.y, 10, G.evo, 220, 0.4, 10); } break;
        case 'mend': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: 'mend' }); break; // 癒孢補血
        case 'burst': fx.rings.push({ x: e.x, y: e.y, r: e.small ? 30 : 70, life: 0.35, color: 'spore' }); break;
        case 'chest': fx.whiteFlash = 0.5; burst(e.x, e.y, 40, G.gold, 260, 0.8, 14); break;
        case 'heal': burst(e.x, e.y, 16, G.heal, 120); break;
        case 'magnet': fx.rings.push({ x: e.x, y: e.y, r: 300, life: 0.5, color: 'magnet' }); break;
        case 'announce': banner(e.text, e.big); if (e.big) fx.shake = 10; break;
        case 'blast': fx.shake = Math.max(fx.shake, 6); fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: 'blast' }); burst(e.x, e.y, 26, G.blast, 240, 0.6, 14); break;
        case 'blink': burst(e.x, e.y, 14, G.crystal, 150, 0.4, 10); break;
        case 'spark': burst(e.x, e.y, 3, G.crystal, 90, 0.25, 8); break;
        case 'strike': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: e.evo ? 'gold' : 'strike' }); burst(e.x, e.y, e.evo ? 22 : 16, e.evo ? G.evo : G.star2, e.evo ? 260 : 200, 0.45, 12); fx.shake = Math.max(fx.shake, e.evo ? 5 : 3); break;
        case 'mineBoom': fx.rings.push({ x: e.x, y: e.y, r: e.r, life: 0.35, color: e.evo ? 'gold' : 'blast' }); burst(e.x, e.y, e.evo ? 26 : 18, e.evo ? G.evo : G.lantern, e.evo ? 280 : 220, 0.5, 12); break;
        case 'revive': fx.whiteFlash = 1; banner('燈芯復燃！', true); burst(e.x, e.y, 80, G.gold, 320, 1, 14); break;
        case 'bossdown': fx.whiteFlash = 1; fx.shake = 16; burst(e.x, e.y, 120, G.gold, 380, 1.4, 16); burst(e.x, e.y, 80, G.spore, 300, 1.2, 14); break;
      }
    }
    s.events.length = 0;
    fx.shake = Math.max(0, fx.shake - dt * 30);
    for (const k of ['levelFlash', 'hurtFlash', 'whiteFlash']) fx[k] = Math.max(0, fx[k] - dt * (k === 'whiteFlash' ? 1.5 : 1));
    for (const q of fx.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt; }
    fx.parts = fx.parts.filter((q) => q.life > 0);
    if (fx.parts.length > MAX_PARTS) fx.parts.splice(0, fx.parts.length - MAX_PARTS);
    for (const q of fx.texts) { q.y -= 30 * dt; q.life -= dt; }
    fx.texts = fx.texts.filter((q) => q.life > 0);
    if (fx.texts.length > 80) fx.texts.splice(0, fx.texts.length - 80);
    for (const list of [fx.arcs, fx.rings, fx.banners, fx.lances, fx.snipes]) for (const q of list) q.life -= dt;
    fx.arcs = fx.arcs.filter((q) => q.life > 0); fx.rings = fx.rings.filter((q) => q.life > 0); fx.banners = fx.banners.filter((q) => q.life > 0); fx.lances = fx.lances.filter((q) => q.life > 0); fx.snipes = fx.snipes.filter((q) => q.life > 0);
  }

  // prof：效能量測模式（src/perf.js）才會傳入，每畫完一段呼叫 lap 記錄耗時；平常是 null，不花成本
  let lastGuides = [];
  // 回傳這一幀畫了哪些燈核指引（shop-test 拿去和自己算的座標比對；平常沒人用）
  function render(g, s, dt, W, H, scale, safeTop = 0, hud = true, prof = null) {
    prof?.start();
    lastGuides = [];
    const OFF = prof?.off ?? NONE; // 效能量測的 A/B：關掉指定的繪製項目，看總時間少多少（平常是空集合）
    consume(s, dt);
    prof?.lap('特效更新');
    const vh = H / scale, p = s.player, T = s.t;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    const sx = (Math.random() - 0.5) * fx.shake, sy = (Math.random() - 0.5) * fx.shake;
    const camX = p.x - VW / 2 + sx, camY = p.y - vh / 2 + sy;
    g.setTransform(scale, 0, 0, scale, -camX * scale, -camY * scale);
    const onScreen = (x, y, m = 60) => x > camX - m && x < camX + VW + m && y > camY - m && y < camY + vh + m;
    const glowK = GLOW.on ? glowBudget(s, p, onScreen) : null, kE = glowK?.evo ?? 1, kP = glowK?.parts ?? 1, kG = glowK?.gems ?? 1;

    const C = screenCache(W, H, scale);
    if (OFF.has('ground')) { g.fillStyle = '#101020'; g.fillRect(camX, camY, VW, vh); }
    else if (OFF.has('cache')) { g.fillStyle = g.createPattern(ground, 'repeat'); g.fillRect(camX, camY, VW, vh); } // 優化前的舊做法（A/B 對照用）
    else { // 螢幕空間平鋪預先放大的地面磚（通常 4～6 次 drawImage）
      g.setTransform(1, 0, 0, 1, 0, 0);
      const T = C.T, ox = -((((camX * scale) % T) + T) % T), oy = -((((camY * scale) % T) + T) % T);
      for (let x = Math.round(ox); x < W; x += T) for (let y = Math.round(oy); y < H; y += T) g.drawImage(C.tile, x, y);
      g.setTransform(scale, 0, 0, scale, -camX * scale, -camY * scale);
    }
    prof?.lap('地面');

    // 泥沼：深色水窪＋一圈反光
    const ter = s.chapter.terrain;
    if (ter === 'pools') for (const f of terrainIn('pools', s.terrainSeed, camX - 80, camY - 80, camX + VW + 80, camY + vh + 80)) {
      // 顏色要和霧沼地面明顯不同（先前太接近底色，等於隱形）：偏青綠的濁水＋亮邊＋漂浮反光
      const pg = g.createRadialGradient(f.x, f.y - f.r * 0.2, f.r * 0.1, f.x, f.y, f.r);
      pg.addColorStop(0, 'rgba(70,140,120,0.85)'); pg.addColorStop(0.75, 'rgba(40,95,80,0.8)'); pg.addColorStop(1, 'rgba(30,70,60,0.2)');
      g.fillStyle = pg; g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.8, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(160,240,200,0.45)'; g.lineWidth = 2;
      g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.8, 0, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = `rgba(200,255,230,${0.25 + Math.sin(T * 1.5 + f.x) * 0.12})`; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(f.x - f.r * 0.2, f.y - f.r * 0.15, f.r * 0.35, f.r * 0.12, -0.2, 0, Math.PI * 2); g.stroke();
    }

    // 熔坑（第四章）：焦黑坑洞；預警時坑緣的橘光一圈圈收緊，噴發時整個坑冒出亮橘色火柱
    if (ter === 'vents') for (const f of terrainIn('vents', s.terrainSeed, camX - 80, camY - 80, camX + VW + 80, camY + vh + 80)) {
      const st = ventState(f, s.terrainSeed, T);
      g.fillStyle = 'rgba(20,8,6,0.85)'; g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.78, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(255,110,50,0.45)'; g.lineWidth = 2; g.stroke();
      if (st?.warn !== undefined) {
        g.fillStyle = `rgba(255,120,40,${0.1 + st.warn * 0.3})`; g.fill();
        g.strokeStyle = `rgba(255,190,90,${0.5 + st.warn * 0.5})`; g.lineWidth = 2.5; g.setLineDash([6, 5]);
        g.beginPath(); g.ellipse(f.x, f.y, f.r * (1.5 - st.warn * 0.5), f.r * 0.78 * (1.5 - st.warn * 0.5), 0, 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      } else if (st?.fire) {
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = 0.8 + Math.random() * 0.2; g.drawImage(G.lava, f.x - f.r * 1.6, f.y - f.r * 1.9, f.r * 3.2, f.r * 3.2); g.globalAlpha = 1;
        g.fillStyle = 'rgba(255,220,140,0.55)'; g.beginPath(); g.ellipse(f.x, f.y, f.r * 0.85, f.r * 0.66, 0, 0, Math.PI * 2); g.fill();
        g.globalCompositeOperation = 'source-over';
      }
    }
    // 冰面（第五章）：半透明淡藍冰片＋幾道反光（踩上去會滑）
    if (ter === 'ice') for (const f of terrainIn('ice', s.terrainSeed, camX - 100, camY - 100, camX + VW + 100, camY + vh + 100)) {
      const ig = g.createRadialGradient(f.x - f.r * 0.3, f.y - f.r * 0.3, f.r * 0.1, f.x, f.y, f.r);
      ig.addColorStop(0, 'rgba(220,245,255,0.55)'); ig.addColorStop(0.8, 'rgba(150,200,240,0.4)'); ig.addColorStop(1, 'rgba(120,170,230,0.1)');
      g.fillStyle = ig; g.beginPath(); g.ellipse(f.x, f.y, f.r, f.r * 0.72, 0.3, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(230,250,255,0.5)'; g.lineWidth = 1.5; g.stroke();
      g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(f.x - f.r * 0.5, f.y - f.r * 0.1); g.lineTo(f.x - f.r * 0.1, f.y - f.r * 0.35); g.moveTo(f.x + f.r * 0.1, f.y + f.r * 0.2); g.lineTo(f.x + f.r * 0.45, f.y); g.stroke();
    }

    // 地面危險：預警時畫虛線輪廓，生效時填滿
    for (const h of s.hazards) {
      const active = h.t >= h.arm, k = active ? 1 : h.t / h.arm;
      if (h.type === 'zone') {
        const col = h.src === 'poison' ? '120,255,140' : h.src === 'rain' ? '180,150,255' : h.src === 'fire' ? '255,130,40' : h.src === 'slam' ? '255,190,110' : h.src === 'frostzone' ? '150,220,255' : '255,120,120';
        g.fillStyle = `rgba(${col},${active ? 0.35 : 0.08 + k * 0.12})`;
        g.beginPath(); g.arc(h.x, h.y, h.r, 0, Math.PI * 2); g.fill();
        g.strokeStyle = `rgba(${col},${active ? 0.8 : 0.5})`; g.lineWidth = 2; g.setLineDash(active ? [] : [6, 5]);
        g.beginPath(); g.arc(h.x, h.y, active ? h.r : h.r * (0.4 + k * 0.6), 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
      } else if (h.type === 'beam') {
        g.save(); g.translate(h.x, h.y); g.rotate(h.ang);
        if (active) {
          g.globalCompositeOperation = 'lighter';
          g.fillStyle = 'rgba(200,120,255,0.35)'; g.fillRect(0, -h.w, h.len, h.w * 2);
          g.fillStyle = 'rgba(255,230,255,0.9)'; g.fillRect(0, -h.w * 0.25, h.len, h.w * 0.5);
          g.globalCompositeOperation = 'source-over';
        } else {
          g.strokeStyle = `rgba(230,160,255,${0.3 + k * 0.5})`; g.lineWidth = 2; g.setLineDash([10, 8]);
          g.beginPath(); g.moveTo(0, 0); g.lineTo(h.len, 0); g.stroke(); g.setLineDash([]);
        }
        g.restore();
      }
    }

    // 競技場光圈：外面壓暗，邊緣發光
    if (s.arena) {
      const a = s.arena;
      g.save();
      g.beginPath(); g.rect(camX - 10, camY - 10, VW + 20, vh + 20); g.arc(a.x, a.y, a.r, 0, Math.PI * 2, true);
      g.fillStyle = 'rgba(5,3,14,0.72)'; g.fill('evenodd');
      g.restore();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(255,120,200,${0.45 + Math.sin(T * 4) * 0.15})`; g.lineWidth = 6;
      g.beginPath(); g.arc(a.x, a.y, a.r, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = 'rgba(255,220,255,0.6)'; g.lineWidth = 1.5; g.stroke();
      g.globalCompositeOperation = 'source-over';
    }

    // 菌根牆（第六章）：粗大的根，表面有刺；朝移動方向那一側發暗紅光（代表會被推著走）
    for (const r of s.roots) {
      g.save(); g.translate(r.x, r.y); g.rotate(Math.atan2(r.ny, r.nx));
      const hw = r.w / 2, hl = r.len / 2;
      g.fillStyle = 'rgba(255,60,60,0.18)'; g.fillRect(hw - 2, -hl, 14, r.len);
      const rg = g.createLinearGradient(-hw, 0, hw, 0); rg.addColorStop(0, '#2a1a0c'); rg.addColorStop(0.5, '#5a3a1a'); rg.addColorStop(1, '#3a2410');
      g.fillStyle = rg; g.fillRect(-hw, -hl, r.w, r.len);
      g.fillStyle = '#8a6a3a';
      for (let y = -hl + 10; y < hl; y += 22) { g.beginPath(); g.moveTo(hw, y); g.lineTo(hw + 9, y + 5); g.lineTo(hw, y + 10); g.fill(); }
      g.strokeStyle = 'rgba(180,230,120,0.35)'; g.lineWidth = 1.5; g.strokeRect(-hw, -hl, r.w, r.len);
      g.restore();
    }
    prof?.lap('地形與危險');
    // 燈暈（在怪物底下）
    const aura = p.weapons.find((w) => w.id === 'aura');
    if (aura?.radius) {
      g.globalCompositeOperation = 'lighter';
      const r = aura.radius * (1 + Math.sin(T * 5) * 0.03);
      g.globalAlpha = 0.55; g.drawImage(G.aura, p.x - r, p.y - r, r * 2, r * 2); g.globalAlpha = 1;
      g.strokeStyle = 'rgba(255,190,110,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.stroke();
      if (aura.evo) { // 共鳴「暖陽」：一圈緩慢旋轉的金色光芒
        g.strokeStyle = 'rgba(255,220,120,0.35)'; g.lineWidth = 3;
        for (let i = 0; i < 12; i++) { const a = T * 0.6 + (i / 12) * Math.PI * 2; g.beginPath(); g.moveTo(p.x + Math.cos(a) * r * 0.45, p.y + Math.sin(a) * r * 0.45); g.lineTo(p.x + Math.cos(a) * r * 0.95, p.y + Math.sin(a) * r * 0.95); g.stroke(); }
      }
      g.globalCompositeOperation = 'source-over';
    }

    // 經驗晶
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = kG;
    if (!OFF.has('glow')) for (const gm of s.gems) if (onScreen(gm.x, gm.y)) { const k = gm.big ? 2 : 1; g.drawImage(G.gem, gm.x - 12 * k, gm.y - 12 * k, 24 * k, 24 * k); }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#bff6ff';
    for (const gm of s.gems) {
      if (!onScreen(gm.x, gm.y)) continue;
      const k = gm.big ? 1.8 : gm.v >= 5 ? 1.35 : 1;
      g.beginPath(); g.moveTo(gm.x, gm.y - 5 * k); g.lineTo(gm.x + 3.5 * k, gm.y); g.lineTo(gm.x, gm.y + 5 * k); g.lineTo(gm.x - 3.5 * k, gm.y); g.fill();
    }

    // 道具
    for (const it of s.pickups) {
      const bob = Math.sin(T * 4 + it.x) * 3;
      g.globalCompositeOperation = 'lighter';
      const gl = it.type === 'chest' ? G.gold : it.type === 'heal' ? G.heal : G.magnet;
      g.globalAlpha = 0.7 + Math.sin(T * 6) * 0.2; g.drawImage(gl, it.x - gl.width / 2, it.y - gl.height / 2 + bob); g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
      if (it.type === 'chest') { // M8 第三輪：燈核上方加一道光柱，遠遠就看得到
        const beam = g.createLinearGradient(0, it.y - 150, 0, it.y);
        beam.addColorStop(0, 'rgba(255,220,120,0)'); beam.addColorStop(1, `rgba(255,220,120,${0.35 + Math.sin(T * 4) * 0.12})`);
        g.globalCompositeOperation = 'lighter'; g.fillStyle = beam; g.fillRect(it.x - 7, it.y - 150, 14, 150); g.globalCompositeOperation = 'source-over';
        g.drawImage(chestImg, it.x - 20, it.y - 22 + bob);
      }
      else { const ic = makeIcon(it.type === 'heal' ? 'heal' : 'stone', it.type === 'heal' ? '#ff9fb4' : '#7fd6ff', 24); g.drawImage(ic, it.x - 12, it.y - 12 + bob); }
    }

    prof?.lap('光屑與道具');
    // 玩家的落星預警（粉紅虛線圈，越接近落下越實）與地上的燈籠雷
    for (const k of s.strikes) {
      const q = Math.max(0, 1 - k.t / k.delay);
      g.fillStyle = k.evo ? `rgba(255,210,120,${0.1 + q * 0.2})` : `rgba(255,150,240,${0.08 + q * 0.18})`; g.beginPath(); g.arc(k.x, k.y, k.r, 0, Math.PI * 2); g.fill();
      g.strokeStyle = k.evo ? 'rgba(255,230,160,0.9)' : 'rgba(255,190,245,0.8)'; g.lineWidth = 1.5; g.setLineDash([5, 4]); g.beginPath(); g.arc(k.x, k.y, k.r * (1.4 - q * 0.4), 0, Math.PI * 2); g.stroke(); g.setLineDash([]);
    }
    for (const m of s.mines) {
      const armed = m.arm <= 0, pulse = armed ? 0.7 + Math.sin(T * 6 + m.x) * 0.3 : 0.35;
      g.globalCompositeOperation = 'lighter'; if (m.evo) { g.globalAlpha = pulse * kE; g.drawImage(G.evo, m.x - 22, m.y - 22, 44, 44); } g.globalAlpha = pulse; g.drawImage(G.lantern, m.x - 14, m.y - 14); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
      g.fillStyle = armed ? (m.evo ? '#fff0b0' : '#ffd84a') : '#8a7a3a'; g.beginPath(); g.ellipse(m.x, m.y, 4.5, 5.5, 0, 0, Math.PI * 2); g.fill();
    }
    // 燈塔哨：小燈塔＋頂端的光（快熄滅時閃爍）；共鳴後多一圈金光
    for (const q of s.sentries) {

//   輕場面：開局前 300 幀
//   重場面：快轉到第 360 秒（大量怪物、共鳴武器）後再量 600 幀
// 每一幀記錄：瀏覽器給的幀間隔、邏輯耗時、繪製耗時（再細分各繪製步驟）。量完在畫面上顯示報表，也放在 window.__perf。

// &off=fog,vignette,glow,particles,ground,filter：A/B 量測，關掉指定的繪製項目（看各項佔多少）
//   &off=cache：地面／霧／暗角改走優化前的舊做法（每幀重建圖樣與漸層），用來做前後對照

  // 場面依時間先後排（只能往後快轉）：輕場面 0 秒 →（菌潮開著才有）菌潮滿場 → 重場面 360 秒

        sync ? '幀間隔：同步模式不量（只量繪製成本）' : `平均 ${f1(r.fps)} fps；幀間隔 p50 ${f1(r.iv.p50)}／p95 ${f1(r.iv.p95)}／p99 ${f1(r.iv.p99)}／最慢 ${f1(r.iv.max)} ms；超過 20ms 的幀 ${r.iv.over20}、超過 34ms 的幀 ${r.iv.over34}`,

        `繪製 p50 ${f1(r.render.p50)}／p95 ${f1(r.render.p95)}／p99 ${f1(r.render.p99)}／最慢 ${f1(r.render.max)} ms`,
        `音效（排程＋合成）p50 ${r.audio.p50.toFixed(2)}／p99 ${r.audio.p99.toFixed(2)}／最慢 ${r.audio.max.toFixed(2)} ms；同時發聲最多 ${r.audio.voices}${r.audio.live ? '' : '（音效還沒解鎖：只量到排程，量合成要先點一下畫面）'}`,

  if (settled) return settled;
  const s = sim.state;
  settled = settleRun(profile, { ledger: s.ledger, chapterId, stage: stageNo, won: s.phase === 'win', t: s.t, kills: s.kills }, makeRng(runSeed ^ 0x9e3779b9));
  persist();
  return settled;
}

// 依 sim 狀態決定要顯示哪個面板（只在狀態改變時重畫 DOM）
function sync() {
  if (mode === 'menu') return;
  const s = sim.state;
  const want = paused ? 'pause' : s.phase;
  if (want === shown) return;
  shown = want;
  if (want === 'choice') ui.levelUp(s.choice);
  else if (want === 'chest') ui.chest(s.chest);
  else if (want === 'pause') ui.pause(s);
  else if (want === 'win' || want === 'lose') { const sum = settle(); setTimeout(() => ui.result(s, sum, profile), want === 'lose' && !s.quit ? 700 : 0); }
  else if (want === 'play') ui.hud();
}

function demoStep(dt) {
  const s = sim.state;
  if (s.phase === 'choice') sim.choose(0);
  if (s.phase === 'chest') sim.closeChest();
  if (s.t > 150) { sim = createSim({ seed: 7, vh: H / scale }); sim.state.god = true; } // 展示局定期重來，避免怪太多
  const a = s.t * 0.35;
  sim.update(dt, { x: Math.cos(a) * 0.6, y: Math.sin(a) * 0.6 });
}

const fps = { frames: 0, acc: 0, value: 0, worst: 0, cur: 0 };
let last = performance.now();
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(raw, 1 / 30); // 分頁切回來時不要一次跳太多
  const t0 = performance.now();
  if (perf) { perfFrame(now, dt); requestAnimationFrame(frame); return; }
  if (mode === 'menu') demoStep(dt);
  else if (!paused && sim.state.phase === 'play') {
    // 固定步長：每步永遠 1/60 秒，倍速＝這一幀多跑幾步（見 clock.js）。掉幀時一樣靠多跑幾步補回，最多 MAX_STEPS 步。
    const { steps, dt: sdt } = clock.advance(raw, speed());
    for (let i = 0; i < steps && sim.state.phase === 'play'; i++) sim.update(sdt, input.move);
    sync();
  } else { clock.reset(); if (!paused) sync(); } // 選卡／燈核／暫停時不累積時間，回來不會一口氣補一大段
  // 音效：只在正式一局出聲（主選單背景的展示局不出聲）；要在 render 之前讀，render 會把這一幀的事件清掉
  const ta = performance.now();
  audio.onEvents(mode === 'run' ? sim.state.events : [], now / 1000);
  fps.audio = performance.now() - ta;
  renderer.render(g, sim.state, paused || sim.state.phase !== 'play' ? 0 : dt * (mode === 'run' ? speed() : 1), W, H, scale, safeTop, mode === 'run');
  if (input.stick.active && mode === 'run' && sim.state.phase === 'play' && !paused) drawStick();
  const cost = performance.now() - t0;
  fps.frames++; fps.acc += raw; fps.worst = Math.max(fps.worst, cost);
  if (fps.acc >= 1) { fps.value = fps.frames / fps.acc; fps.cur = fps.worst; fps.frames = 0; fps.acc = 0; fps.worst = 0; }
  if (DEBUG) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.font = `${12 * (W / canvas.clientWidth)}px monospace`; g.fillStyle = '#0f0'; g.textAlign = 'left';
    const s = sim.state;
    g.fillText(`fps ${fps.value.toFixed(0)}  worst ${fps.cur.toFixed(1)}ms  enemies ${s.enemies.length}  bullets ${s.bullets.length}  gems ${s.gems.length}`, 8, H - 10);
  }
  requestAnimationFrame(frame);
}

// 逼 GPU 做完主畫布的繪製：把主畫布縮畫到 1×1 小畫布再讀回。
// 不能直接對主畫布 getImageData——Chrome 會把常被讀回的畫布降級成 CPU 繪圖，量到的就不是實際情況（先前踩過）。
let flushCtx = null;
function flushGPU() {
  flushCtx ??= Object.assign(document.createElement('canvas'), { width: 1, height: 1 }).getContext('2d', { willReadFrequently: true });
  flushCtx.drawImage(canvas, 0, 0, 1, 1); flushCtx.getImageData(0, 0, 1, 1);
}

// 畫面亮度：把主畫布縮畫到 90 寬的小畫布再讀回（不直接讀主畫布，理由同 flushGPU），回傳「過亮」的像素比例。
// 「過亮」＝亮度（luma）≥ 220：白、淡金、淡黃都算（加法疊加飽和後就是這些顏色）。M8 擁有者回報特效把畫面變成一團白光，這是瀏覽器裡量它的尺（Node 裡的近似量測見 tools/glow-check.mjs）。
let whiteCtx = null;
function measureWhite() {
  const w = 90, h = Math.max(1, Math.round(90 * H / W));
  whiteCtx ??= Object.assign(document.createElement('canvas'), { width: w, height: h }).getContext('2d', { willReadFrequently: true });
  whiteCtx.canvas.height = h; whiteCtx.clearRect(0, 0, w, h); whiteCtx.drawImage(canvas, 0, 0, w, h);
  const d = whiteCtx.getImageData(0, 0, w, h).data; let n = 0, sum = 0;
  for (let i = 0; i < d.length; i += 4) { const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; sum += y; if (y >= 220) n++; }
  measureWhite.mean = sum / (w * h); // 平均亮度（0～255）：抓「整片灰白霧」這種不到全白、但整體被洗亮的情況
  return n / (w * h);
}
// 效能量測模式：自動跑、自動選升級；需要快轉時整段只跑邏輯不畫
function perfFrame(now, dt) {
  const s = sim.state;
  const auto = () => { if (s.phase === 'choice') sim.choose(0); if (s.phase === 'chest') sim.closeChest(); };
  if (perf.needsSkip(s)) { for (let i = 0; i < (perf.sync ? 3000 : 600) && s.t < perf.skipTo(perf.stage); i++) { auto(); sim.update(1 / 60, perf.move(s)); s.events.length = 0; } }
  for (let k = 0; k < (perf.sync && !perf.done && !perf.needsSkip(s) ? 30 : 1); k++) {
    auto();
    const step = perf.sync ? 1 / 60 : dt;
    const t0 = performance.now(); sim.update(step, perf.move(s)); const t1 = performance.now();
    const ta = performance.now(); audio.onEvents(s.events, s.t); const aud = { ms: performance.now() - ta, voices: audio.mixer.playing.length, live: audio.ctx?.state === 'running' }; // 音效也照正式遊玩的方式跑（先點一下畫面才會真的發聲）
    renderer.render(g, s, step, W, H, scale, safeTop, true, perf.done ? null : perf.prof);
    if (perf.sync) flushGPU(); // 逼 GPU 把這一幀做完，計時才包含真正的繪製
    const t2 = performance.now();
    perf.record(now, t1 - t0, t2 - t1, s, perf.frameNo() % 6 === 0 ? measureWhite() : null, aud); // 亮度取樣（不計入繪製時間）
  }
  const box = document.getElementById('perfBox');
  box.style.display = 'block';
  box.textContent = perf.done ? perf.report.text : `效能量測中…（${perf.stage + 1}/${perf.stageCount}）第 ${Math.floor(s.t)} 秒`;
}

// 浮動搖桿
function drawStick() {
  const st = input.stick, k = scale;
  g.setTransform(k, 0, 0, k, 0, 0);
  const cssToLogic = (W / canvas.clientWidth) / k;
  const rect = canvas.getBoundingClientRect();
  const ox = (st.ox - rect.left) * cssToLogic, oy = (st.oy - rect.top) * cssToLogic;
  let dx = (st.x - st.ox) * cssToLogic, dy = (st.y - st.oy) * cssToLogic;
  const R = input.RADIUS * cssToLogic, d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  g.fillStyle = 'rgba(255,255,255,0.07)'; g.strokeStyle = 'rgba(255,220,160,0.3)'; g.lineWidth = 2;
  g.beginPath(); g.arc(ox, oy, R, 0, Math.PI * 2); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,230,180,0.55)'; g.beginPath(); g.arc(ox + dx, oy + dy, R * 0.42, 0, Math.PI * 2); g.fill();
}

// 同步量測入口：頁面被判定為隱藏時 rAF 會完全停止，改由外部直接呼叫 window.__perfRun() 一次跑完整段量測
// budget：這次最多跑幾毫秒（沒跑完就回傳進度，再呼叫一次接著跑）
// 同步量測模式才有：讓量測腳本能擺出指定場面、畫一幀、量亮度（正式遊玩不會有這個入口）
if (perf?.sync) window.__perfDebug = { get sim() { return sim; }, frame(n = 1) { for (let i = 0; i < n; i++) { sim.update(1 / 60, { x: 0, y: 0 }); renderer.render(g, sim.state, 1 / 60, W, H, scale, safeTop, true, null); } flushGPU(); return measureWhite(); } };
if (perf?.sync) window.__perfRun = (budget = 20000) => {
  const end = performance.now() + budget;
  while (!perf.done && performance.now() < end) perfFrame(performance.now(), 1 / 60);
  return perf.done ? perf.report.text : document.getElementById('perfBox').textContent;
};
if (perf) { // 量測模式不動存檔：用空白進度、無敵、固定 seed
  mode = 'run'; sim = createSim({ seed: 12345, vh: H / scale, chapter: perf.chapter }); sim.state.god = true; sim.state.surgeOn = perf.waves;
  // &evo=aura,orbit,pulse,wisps：量「後期滿配」的畫面——指定的武器全部滿級並共鳴、四個被動滿級（特效最多的情況）
  if (params.get('evo')) {
    const p = sim.state.player; p.weapons = [];
    for (const id of params.get('evo').split(',')) { const w = sim.addWeapon(id); w.lv = 5; w.evo = true; }
    for (const id of ['lens', 'wick', 'stone', 'ember']) p.passives[id] = 5;
    sim.recalc(); p.hp = p.maxHp;
  }
  renderer = createRenderer(perf.chapter); ui.hud(); document.getElementById('pauseBtn').style.display = 'none';
} else toMenu();
if (!perf && LOAD_NOTICE[loaded.status]) ui.toast(LOAD_NOTICE[loaded.status], 6000);
// 升級或修復成功就立刻寫回：否則在玩家做任何動作前，每次開遊戲都會重新升級、重跳提示
if (!perf && loaded.writable && ['migrated', 'repaired', 'corrupt'].includes(loaded.status)) persist();
requestAnimationFrame(frame);

return {  };
})();
</script>

  // 相對路徑註冊：在 GitHub Pages 子路徑下 scope 自動是該子路徑。換版後的重新載入由 main.js 處理。
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
  }
</script>
